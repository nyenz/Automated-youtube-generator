<script id="player">
/* ===================================================================== */
/* PART C - PLAYER AND PROJECT BOARD (keep as is)                         */
/* Plays the FULL narration file from each part's AUDIO_START.            */
/* window.seek(t)      draws a frame of the joined video (all built parts)*/
/* window.seek(t, id)  draws a frame of one part (t from that part's 0)   */
/* window.LINT()       runs the checks and returns the list               */
/* ===================================================================== */
const PROJECT=JSON.parse(document.getElementById('project').textContent);
const $=id=>document.getElementById(id),scr=$('scr'),scrub=$('scrub'),tm=$('tm'),pb=$('play'),nar=$('nar'),syn=$('sync');
let sel='all',playing=false,t0=0,base=0,hasAudio=false,lastSeek=0;
const built=()=>Object.keys(PARTS).map(Number).sort((a,b)=>PARTS[a].AUDIO_START-PARTS[b].AUDIO_START);
function segs(which){const list=which==='all'?built():[+which];let g=0;return list.filter(id=>PARTS[id]).map(id=>{const o={P:PARTS[id],g0:g};g+=PARTS[id].END;return o;});}
const total=w=>segs(w).reduce((n,s)=>n+s.P.END,0);
function locate(g,w){const S=segs(w);let s=S[S.length-1];for(const x of S)if(g<x.g0+x.P.END){s=x;break;}return {P:s.P,t:Math.max(0,g-s.g0)};}
function draw(g,w){const L=locate(g,w);scr.innerHTML=L.P.render(L.t);return L;}
window.seek=(t,id)=>{if(id!=null)scr.innerHTML=PARTS[id].render(t);else draw(t,'all');};
window.TIMELINE=()=>segs('all').map(s=>({id:s.P.id,from:s.g0,length:s.P.END,audioStart:s.P.AUDIO_START}));
/* ---------- checks ---------- */
const norm=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();
function lintPart(P){const R=[],ok=(c,m)=>R.push({ok:!!c,msg:m}),S=P.SEG,nW=S.reduce((n,s)=>n+s[2].split(' ').length,0),a0=S[0][0],a1=S[S.length-1][1],rate=nW/(a1-a0);
  const pj=PROJECT.parts.find(p=>p.id===P.id);
  ok(a0-P.AUDIO_START>=0&&a0-P.AUDIO_START<=.6,'First word starts '+(a0-P.AUDIO_START).toFixed(2)+' s after AUDIO_START (must be 0 to 0.6)');
  ok(rate>=2.2&&rate<=3.6,'Voice speed '+rate.toFixed(1)+' words a second (must be 2.2 to 3.6)');
  ok(S.every(s=>{const n=s[2].split(' ').length,r=n/(s[1]-s[0]);return n<3||(r>1.2&&r<5.5);})&&S.every((s,i)=>!i||s[0]>=S[i-1][1]-.01),'Every SEG piece has a normal speed and the pieces are in order');
  ok(a1<=P.AUDIO_END+.01,'Last word ends before AUDIO_END');
  if(pj){ok(Math.abs(pj.start-P.AUDIO_START)<.03&&Math.abs(pj.end-P.AUDIO_END)<.03,'AUDIO_START and AUDIO_END match the project plan ('+pj.start+' to '+pj.end+')');
    if(pj.text)ok(norm(S.map(s=>s[2]).join(' '))===norm(pj.text),'SEG holds exactly the words of this part in the project plan');
    ok((P.IN||'')===pj.in&&(P.OUT||'')===pj.out,'Joins match the project plan (in: '+pj.in+', out: '+pj.out+')');}
  else ok(false,'Part '+P.id+' is not in the project plan');
  ok(!P.missing.length,'Every T() word was found'+(P.missing.length?' (missing: '+P.missing.join(', ')+')':''));
  const K=P.KEYS;ok(K[0][0]===0&&Math.abs(K[K.length-1][0]-P.END)<.01&&K.every((k,i)=>!i||k[0]>K[i-1][0]),'Camera keys start at 0, end at END and go forward in time');
  ok(K.every(k=>k[3]>=(STAGE.name==='wide'?.45:.8)&&k[3]<=9),'Zoom stays inside the allowed range');
  let rest=0,at=0;for(let i=1;i<K.length;i++){const a=K[i-1],b=K[i],still=Math.abs(b[1]-a[1])*a[3]<40&&Math.abs(b[2]-a[2])*a[3]<40&&Math.max(b[3]/a[3],a[3]/b[3])<1.04;if(still&&b[0]-a[0]>rest){rest=b[0]-a[0];at=a[0];}}
  ok(rest<=2.6,'Camera never rests longer than 2.6 s'+(rest>2.6?' (rests '+rest.toFixed(1)+' s at '+at.toFixed(1)+' s)':''));
  let gap=0;for(let i=1;i<K.length;i++)gap=Math.max(gap,K[i][0]-K[i-1][0]);ok(gap<=4.2,'A new camera key at least every 4.2 s (longest gap '+gap.toFixed(1)+' s)');
  ok(P.HITS.length>=P.END/7,'Shake hits on key words: '+P.HITS.length+' (at least 1 for every 7 s)');
  ok(P.HITS.every(h=>h[1]>=3&&h[1]<=11),'Shake strengths between 3 and 11');
  ok(P.MOODS.every(m=>typeof m[1]!=='string'||MOOD[m[1]]),'Every mood name exists');
  let bad='';for(let i=0;i<=60&&!bad;i++){const t=P.END*i/60;try{const o=P.render(t);if(/NaN|undefined/.test(o))bad='NaN or undefined in the picture at '+t.toFixed(2)+' s';}catch(e){bad='error at '+t.toFixed(2)+' s: '+e.message;}}
  ok(!bad,'Every frame draws without an error'+(bad?' ('+bad+')':''));
  return R;}
function lintProject(){const R=[],ok=(c,m)=>R.push({ok:!!c,msg:m}),ps=PROJECT.parts;
  ok(ps.every((p,i)=>!i||Math.abs(p.start-ps[i-1].end)<.03),'Parts touch: each part starts where the one before ends');
  ok(ps.every((p,i)=>!i||p.in===ps[i-1].out),'Each join is the same on both sides');
  const needC=[...new Set(ps.flatMap(p=>p.cast||[]))].filter(n=>!CAST[n]),needA=[...new Set(ps.flatMap(p=>p.assets||[]))].filter(n=>!ASSETS[n]);
  ok(!needC.length,'Every planned person is in CAST'+(needC.length?' (missing: '+needC.join(', ')+')':''));
  ok(!needA.length,'Every planned asset is in the library'+(needA.length?' (missing: '+needA.join(', ')+')':''));
  const V=['side','front','back'],badH=[],badO=[];
  Object.keys(CAST).forEach(n=>{const ch=CAST[n];
    if(!LOOKS.builtinHair.includes(ch.hat)){const d=LOOKS.hair[ch.hat];if(!d||!V.every(v=>d[v]&&Object.values(d[v]).some(f=>typeof f==='function')))badH.push(n+' ('+ch.hat+')');}
    if(!LOOKS.builtinOutfit.includes(ch.kind)){const d=LOOKS.outfit[ch.kind];if(!d||!V.every(v=>typeof d[v]==='function'))badO.push(n+' ('+ch.kind+')');}});
  ok(!badH.length,'Every person\'s hair or hat has a side, front and back drawing'+(badH.length?' (missing: '+badH.join(', ')+')':''));
  ok(!badO.length,'Every person\'s outfit has a side, front and back drawing'+(badO.length?' (missing: '+badO.join(', ')+')':''));
  let badR='';Object.keys(CAST).forEach(n=>V.forEach(v=>{if(badR)return;try{UID=9000;const o=place(CAST[n],0,0,poseAt('stand',1),faceAt('neutral',1),{light:'left',state:'normal',headR:43,t:1,size:1,view:v});if(/NaN|undefined/.test(o))badR=n+' '+v;}catch(e){badR=n+' '+v+': '+e.message;}}));UID=0;
  ok(!badR,'Every person draws in every view without an error'+(badR?' ('+badR+')':''));
  return R;}
window.LINT=()=>{const o={project:lintProject()};built().forEach(id=>o['part '+id]=lintPart(PARTS[id]));return o;};
/* ---------- video tab ---------- */
function syncLine(){let h='';const b=built();
  if(sel==='all'){const miss=PROJECT.parts.map(p=>p.id).filter(id=>!PARTS[id]);h='<b>JOINED</b> parts <i>'+b.join(', ')+'</i> &middot; <i>'+total('all').toFixed(1)+' s</i>'+(miss.length?' &middot; not built yet: <i>'+miss.join(', ')+'</i>':' &middot; all parts built');}
  else{const P=PARTS[sel],S=P.SEG,n=S.reduce((k,s)=>k+s[2].split(' ').length,0),bad=lintPart(P).slice(0,7).some(r=>!r.ok);
    h='<b>SYNC</b> part '+P.id+' &middot; audio <i>'+P.AUDIO_START.toFixed(2)+' to '+P.AUDIO_END.toFixed(2)+' s</i> &middot; starts &ldquo;'+S[0][2].split(' ').slice(0,3).join(' ')+'&rdquo; &middot; ends &ldquo;'+S[S.length-1][2].split(' ').slice(-3).join(' ')+'&rdquo; &middot; '+n+' words'+(bad?' &middot; <b>CHECK FAILED: open Checks</b>':'');}
  syn.innerHTML=h+'<br>'+(hasAudio?'Narration loaded. It plays from the right second by itself.':'No narration loaded. Press Audio and pick the full narration file ('+PROJECT.audio.file+').');}
function setSel(w){stop();sel=w;scrub.max=total(w).toFixed(2);scrub.value=0;base=0;tm.textContent='0.0 s';
  $('ptabs').innerHTML=['all'].concat(PROJECT.parts.map(p=>p.id)).map(id=>'<button class="pt'+(String(id)===String(sel)?' on':'')+'" data-p="'+id+'"'+(id!=='all'&&!PARTS[id]?' disabled title="Not built yet"':'')+'>'+(id==='all'?'All':'Part '+id)+'</button>').join('');
  draw(sel==='all'?0:Math.min(1.2,total(w)),sel);syncLine();}
$('ptabs').onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)setSel(b.dataset.p==='all'?'all':+b.dataset.p);};
function stop(){playing=false;pb.textContent='Play';nar.pause();}
function tick(now){if(!playing)return;const g=base+(now-t0)/1000,T=total(sel);
  if(g>=T){draw(T-.001,sel);scrub.value=T;stop();return;}
  const L=draw(g,sel);scrub.value=g;tm.textContent=g.toFixed(1)+' s';
  if(hasAudio){const want=L.P.AUDIO_START+L.t;if(nar.paused||(Math.abs(nar.currentTime-want)>.15&&now-lastSeek>400&&!nar.seeking)){nar.currentTime=want;lastSeek=now;nar.play().catch(()=>{});}}
  requestAnimationFrame(tick);}
pb.onclick=()=>{if(playing){stop();return;}base=+scrub.value>=total(sel)-.05?0:+scrub.value;playing=true;pb.textContent='Pause';t0=performance.now();lastSeek=0;requestAnimationFrame(tick);};
scrub.oninput=()=>{stop();tm.textContent=(+scrub.value).toFixed(1)+' s';draw(+scrub.value,sel);};
nar.addEventListener('loadedmetadata',()=>{hasAudio=true;$('aud').classList.add('ok');syncLine();});
nar.addEventListener('error',()=>{hasAudio=false;$('aud').classList.remove('ok');syncLine();});
$('aud').onclick=()=>$('pick').click();
$('pick').onchange=e=>{if(e.target.files[0]){nar.src=URL.createObjectURL(e.target.files[0]);nar.load();}};
/* ---------- project board ---------- */
let jmsg='';const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function board(){
  $('v-parts').innerHTML='<div class="panel"><div class="rows">'+PROJECT.parts.map(p=>{const P=PARTS[p.id];return '<div class="row"><div class="n">'+p.id+'</div><div class="mid"><div class="h">'+esc(p.title||'Part '+p.id)+' <span class="mono">'+p.start+' to '+p.end+' s</span></div><div class="s">'+(p.text?'&ldquo;'+esc(p.text.split(' ').slice(0,7).join(' '))+' &hellip;&rdquo;':'Script not filled in yet')+'</div><div class="s">'+esc([p.place,p.time].filter(Boolean).join(' \u00b7 '))+(p.in?' &middot; in: '+p.in+', out: '+p.out:'')+'</div></div><div class="st '+(P?'good':'wait')+'">'+(P?'BUILT':'WAITING')+'</div></div>';}).join('')+'</div>'+(PROJECT.todo?'<div class="note">'+esc(PROJECT.todo)+'</div>':'')+'<div class="acts"><button class="q" id="addp">Add parts from files</button><button class="q" id="savep">Save joined file</button><span id="jmsg">'+jmsg+'</span></div></div>';$('addp').onclick=()=>$('pickp').click();$('savep').onclick=saveJoined;
  const cn=[...new Set(Object.keys(CAST).concat(PROJECT.parts.flatMap(p=>p.cast||[])))];
  $('v-cast').innerHTML='<div class="panel"><div class="grid">'+cn.map((n,i)=>{const ch=CAST[n];if(!ch)return '<div class="card"><div class="th miss">not made yet</div><div class="h">'+esc(n)+'</div></div>';UID=1000+i*60;
    return '<div class="card"><div class="th"><svg viewBox="-420 -350 840 380">'+['side','front','back'].map((v,j)=>place(ch,(j-1)*270,0,poseAt('stand',0),faceAt('neutral',0),{light:'left',state:'normal',headR:43,t:1,size:1,view:v})).join('')+'</svg></div><div class="h">'+esc(n)+'</div><div class="s">scale '+ch.scale+(PROJECT.continuity&&PROJECT.continuity[n]?' &middot; '+esc(PROJECT.continuity[n]):'')+'</div></div>';}).join('')+'</div></div>';
  const an=[...new Set(Object.keys(ASSETS).concat(PROJECT.parts.flatMap(p=>p.assets||[])))];
  $('v-assets').innerHTML='<div class="panel"><div class="grid">'+an.map(n=>{const f=ASSETS[n];if(!f)return '<div class="card"><div class="th miss">not made yet</div><div class="h">'+esc(n)+'</div></div>';const s=f.spec;

  const ps=PROJECT.parts,needA=[...new Set(ps.flatMap(p=>p.assets||[]))].filter(n=>!ASSETS[n]),needC=[...new Set(ps.flatMap(p=>p.cast||[]))].filter(n=>!CAST[n]),wait=ps.filter(p=>!PARTS[p.id]),asks=[];
  asks.push(['1. Plan the whole video (once)','MODE: PROJECT\nFill in the project plan in this file for the whole script. Use the audio map in the plan for the times.\nFULL SCRIPT:\n(paste the whole script here)',PROJECT.todo?'TO DO':'DONE']);
  asks.push(['2. Make the missing assets','MODE: ASSETS\nMake every asset in the project plan that is not in the library yet'+(needA.length?': '+needA.join(', '):'')+'. Return the file with them added and tell me to open the Assets tab.',needA.length?'TO DO':'DONE']);
  asks.push(['3. Make the missing people','MODE: CAST\nAdd every person in the project plan who is not in CAST yet'+(needC.length?': '+needC.join(', '):'')+'. Return the file with them added and tell me to open the Cast tab.',needC.length?'TO DO':'DONE']);
  wait.forEach(p=>asks.push(['4. Build part '+p.id+' (any chat, any model)','MODE: SCENE\nPART: '+p.id+'\nBuild only part '+p.id+' of the project plan in this file. Follow sections 15 and 16. Return the file with the new part block added, and nothing else changed.','TO DO']));
  built().forEach(id=>asks.push(['Improve part '+id,'MODE: IMPROVE\nPART: '+id+'\nFollow section 19. What I want better: (write it here, or leave empty for a full review)','OPTIONAL']));
  asks.push(['Improve a person or a look','MODE: IMPROVE\nPERSON: (name, for example teacher)\nFollow section 18, "Improving a person or a look". What I want better: (write it here, or leave empty for a full review)','OPTIONAL']);
  asks.push(['Improve an asset','MODE: IMPROVE\nASSET: (name, for example ambulance)\nFollow section 17, "Improving an asset". What I want better: (write it here, or leave empty for a full review)','OPTIONAL']);
  asks.push(['5. Join the parts','No model needed. Open the Parts tab, press Add parts from files, pick the files the other chats gave you, then press Save joined file.',wait.length?'LATER':'READY']);
  $('v-ask').innerHTML='<div class="panel"><div class="rows">'+asks.map((a,i)=>'<div class="row ask"><div class="mid"><div class="h">'+esc(a[0])+' <span class="st '+(a[2]==='DONE'||a[2]==='READY'?'good':'wait')+'">'+a[2]+'</span></div><pre>'+esc(a[1])+'</pre></div>'+(a[1].startsWith('MODE')?'<button class="q cp" data-i="'+i+'">Copy</button>':'')+'</div>').join('')+'</div></div>';
  $('v-ask').onclick=e=>{const b=e.target.closest('.cp');if(!b)return;const tx=asks[+b.dataset.i][1];(navigator.clipboard?navigator.clipboard.writeText(tx):Promise.reject()).catch(()=>{const ta=document.createElement('textarea');ta.value=tx;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();});b.textContent='Copied';setTimeout(()=>b.textContent='Copy',1200);};
  const L=LINT();$('v-checks').innerHTML='<div class="panel">'+Object.keys(L).map(k=>'<div class="grp"><div class="h">'+k.toUpperCase()+' <span class="'+(L[k].every(r=>r.ok)?'good':'bad')+'">'+L[k].filter(r=>r.ok).length+' of '+L[k].length+' pass</span></div>'+L[k].map(r=>'<div class="ck"><span class="'+(r.ok?'good':'bad')+'">'+(r.ok?'PASS':'FAIL')+'</span> '+esc(r.msg)+'</div>').join('')+'</div>').join('')+'</div>';
  UID=0;}
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;stop();document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));

/* ---------- joining parts made in other chats ---------- */
$('pickp').onchange=async e=>{let n=0;for(const f of e.target.files){const txt=await f.text(),re=/<script data-part="(\d+)">([\s\S]*?)<\/script>/g;let m;
    while((m=re.exec(txt))){const old=document.querySelector('script[data-part="'+m[1]+'"]');if(old)old.remove();const s=document.createElement('script');s.dataset.part=m[1];s.textContent=m[2];document.body.insertBefore(s,$('player'));n++;}}
  e.target.value='';jmsg=n?n+' part block'+(n>1?'s':'')+' added. Built parts: '+built().join(', ')+'. Now press Save joined file.':'No part blocks found in those files.';setSel(built().length===1?built()[0]:'all');board();};
