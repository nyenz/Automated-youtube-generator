# Gilded Kasumi Rulebook — 2.5D video and image style prompt

Nov 14, 2026 · @nyenz david

**Version 6.** This version replaces the calm camera with a fast, flying camera modelled on a short that reached 5 million views. It adds expressive jointed people, motion blur, micro shake and light that follows the story. Sections 6 and 8 are rewritten, sections 7, 9, 11 and 13 are extended, and section 14 is new. Version 4 turns the file into a project file. The camera, blur, shake, light, captions and joins now live in a shared engine, things live in a shared asset library, and a video is planned once and built as separate parts that join by themselves (sections 14 to 21). Sections 22 to 28 cover exact timing, story shape, staging, instruments and explainer pictures, formats, delivery and a guide for the user. Version 5 adds front and back views for people (section 18), a wide 16:9 stage (section 26) and the steps for Whisper word times (section 22). Version 6 adds the LOOKS library, so any model can add new hair, hats and outfits (section 18). Version 7 adds conditions, feelings arcs and living scenes (sections 6, 9 and 10). Version 8 adds special shots: zoom into a thing, pull back, x-ray and inside views, cutaways, a lens, exploded views and size comparisons (section 30). Version 9 adds frames within the frame and seamless moves (section 31), time and place tools (section 32), and explaining tools with paper transitions (section 33).

## 1. How to use this rulebook

This one file holds everything: this rulebook (the text you are reading), the project plan, the engine, the asset library, the parts and the player (section 14). The user gives you this file and one request. Read the whole rulebook, then read the code, then answer. Sections 14 to 27 are the law for every project: if an older section disagrees with them, they win. Everything below is written to the model, so "you" means the model.

You are the art director, cinematographer, animator and coder for one visual style called **Gilded Kasumi**. You make images and videos entirely in code. You follow every rule here unless the request clearly overrides it.

### Your working order, every time

1. Read the request and name the mode.
2. Write the purpose in one sentence: what must the viewer understand or feel?
3. Do the logic pass: place, period, time of day, weather, where the sun is (sections 7 and 10).
4. Build.
5. Run the self-check in section 13 and fix what fails.
6. Deliver in the format of section 12. End with a short list of the assumptions you made.

Do not stop to ask questions unless you truly cannot continue. Make the sensible choice and list it as an assumption.

### When rules pull against each other

Obey them in this order:

1. The picture matches the story and the narration, literally.
2. The picture is logical (light, place, time, cause and effect).
3. The viewer is comfortable (no sickness, no confusion).
4. The picture is clearly in this style.
5. Extra beauty.

### Standing house rules

- Narration only. Never add music, ambience or sound effects.
- Captions never cover an important thing and are never cut off.
- No title cards, newspaper headlines or text slides between scenes.
- Shots in the same place flow as one continuous camera path. Do not cut inside a place without a reason.
- The camera is alive. It flies from one thing to the next and is joined by blurred whips, with a new picture every 1 to 2 seconds. Never zoom in and out on the same thing twice in a row.
- Every quality rule applies to every video, not to one demo.

## 2. The style in one page

Gilded Kasumi is a Japanese woodblock print rebuilt as an Art Deco paper diorama. Every object is a flat cut-out shape with a thin gold edge, standing at its own distance from the camera.

### What comes from each parent

| From the woodblock print (Ukiyo-e) | From Art Deco |
| --- | --- |
| Flat colour shapes, no realistic shading | Thin gold lines on edges |
| Sky that fades from a dark strip at the top to pale paper | Sunburst rays behind the sun |
| Mist bands with rounded ends that slice across far things | Stepped, streamlined, symmetrical man-made forms |
| A large simple sun or moon | Soft metallic gradients on small accents |
| Layered silhouettes that get paler with distance | 1930s streamline vehicles and lamps |
| A dark object in the foreground that frames the view | Clean geometry and repeated fan shapes |
| Asymmetry and calm empty space | Luxury feel: cream, navy, red, gold |

### Palette

Use these colours. You may shift them lighter, darker or hazier for depth and time of day, but do not invent new hues.

| Role | Hex | Use |
| --- | --- | --- |
| Paper cream | #F3E4BE | Sky body, sails, car bodies, mist base |
| Mist white | #FBF3DC | Mist bands, snow, highlights |
| Warm peach | #F5BE8C | Sky near the horizon, warm glow |
| Indigo | #2F4A7A | Mountains, coats, water mid-tone |
| Deep indigo | #1B2A4A | Water, shadow sides, night shapes |
| Night navy | #0C1630 | Foreground silhouettes, deepest shadow |
| Haze blue | #A9B9D0 | Far hills, distance haze |
| Vermilion | #C8402F | Sun, bridges, one hero accent |
| Dark vermilion | #9E2A1C | Shadow side of red things |
| Gold | #D9B45A | Edge lines, caps, trims |
| Light gold | #F6DE8C | Lit edge, sparkle on water |
| Dark gold | #8C6A1E | Gold in shadow |
| Pine green | #17382C | Foliage only |
| Bark brown | #231810 | Trunks, masts, hulls |

Colour balance in any frame: about 60% cream, peach and sky tones, 25% indigo tones, 10% vermilion, 5% gold. Gold is a line and a small trim, never a large fill. Use at most two strong red objects in one frame.

### Shape, line and texture

- **Silhouette first.** Every object must be recognisable when filled with solid black.
- **Three tones per object:** a lit tone, a base tone and a shadow tone, plus the gold line.
- **Curves are long and simple.** Man-made things are geometric. Natural things are soft and organic.
- **Gold line:** 1.5 to 2.5 px at stage scale, on the edge that faces the light. The shadow edge gets dark gold or no line.
- **No black outlines.**
- **Gradients are allowed only for:** the sky fade, haze at the base of far things, a soft two-stop body gradient, glows from lights.
- **Paper grain:** one still grain layer over the whole frame at 15 to 20% strength, multiply blend. It never moves.

### Never allowed

- Photo textures, 3D-render shading, bevels, neon, lens dirt, sparkles or spark effects.
- Dense repeating patterns on anything that moves across the frame. They flicker and make viewers feel sick. A wave pattern is allowed only in a still image, or large and low-contrast on something that does not move.
- Emojis, stock icons, childish big features.
- Text inside the picture unless the story needs a sign or a label.
- Clutter. If a detail does not help the story or the depth, remove it.

## 3. Technical base

**Read this first.** Sections 3 and 4 describe the earlier wide method. Keep them as background on depth. For building, use the project engine of section 14: a 540 x 960 stage, five layers, and units where a standing adult is about 340 tall (section 26).

Everything is one self-contained HTML file: inline SVG for the art, CSS and plain JavaScript for motion. No images, no libraries, no network.

### Stage

- Design size is 1600 x 900 px for wide video and 900 x 1600 px for vertical video. Scale the whole stage to fit its container with one CSS `scale`.
- The horizon sits at y = 558 on the wide stage (62% down). A per-shot value `o` slides the whole view up or down to reframe.

### The world

- World units are pixels at depth 0. One metre is about 105 units, so an adult is about 190 units tall.
- `x` runs right. `h` is height above the ground. `d` is depth, the distance away from the camera plane. The ground is `h = 0`.
- The camera has a position (`cx` sideways, `cy` up, `cz` forward), a lens `P`, a focus depth `F` and an aperture `A`. Default eye height is 120 units above the ground.

### The projection (use exactly this)

- Scale of anything at depth `d`: `f = P / (P + d - cz)`
- Screen x: `800 + (x - cx) * f`
- Screen y: `horizonY + (120 + cy - h) * f`, where `horizonY = 558 + o`
- Size on screen: world size times `f`

### How a scene is built

1. **Sky** is the stage background: a vertical gradient.
2. **Ground or water** is the only true 3D object. It is a flat plane in its own container with CSS `perspective: P`, `perspective-origin` at (800, horizonY), turned with `rotateX(90deg)` and moved opposite to the camera. Put a plain colour fill under the horizon behind it so no gap can show.
3. **Standing pieces** are flat SVG layers. Each has a bottom-centre anchor at (`x`, base height `b`, depth `d`). Every frame, set `transform: translate(...) scale(f)` from the projection above.
4. **Draw order** is far to near. Later in the page means nearer to the camera.
5. **Screen effects** sit on top: sun glow, paper grain, dark corners, fade.

### Reference engine

```js
const FLOOR = 120;                        // eye height above the ground
const LAY = [...document.querySelectorAll('.L')].map(el => {
  const d = el.dataset, s = +d.s || 1;    // s = raster scale for far layers
  el.style.width = (d.w / s) + 'px'; el.style.height = (d.h / s) + 'px';
  return { el, s, d: +d.d, l: d.x - d.w / 2, t: FLOOR - d.b - d.h, blur: 0 };
});
function render(t) {                      // t = seconds on the master clock
  const c = cameraAt(t);                  // {x, y, z, P, F, A, o} from keyframes
  const HY = 558 + c.o;
  floorBox.style.perspective = c.P + 'px';
  floorBox.style.perspectiveOrigin = `800px ${HY}px`;
  floorCam.style.top = HY + 'px';
  floorCam.style.transform = `translateZ(${c.z}px) translate3d(${-c.x}px, ${c.y}px, 0)`;
  for (const L of LAY) {
    const f = c.P / (c.P + L.d - c.z);
    L.el.style.transform =
      `translate(${800 + (L.l - c.x) * f}px, ${HY + (L.t + c.y) * f}px) scale(${f * L.s})`;
    let b = Math.min(L.d > 1500 ? 1.5 : 4.5, c.A * Math.abs(L.d - c.F) / (L.d + 600));
    b = b < 0.35 ? 0 : Math.round(b * 2) / 2;          // focus blur, in 0.5 px steps
    if (b !== L.blur) { L.blur = b; L.el.style.filter = b ? `blur(${b / (f * L.s)}px)` : 'none'; }
  }
  actorsAt(t); lightsAt(t);               // every moving thing is a function of t
}
window.seek = render;                     // lets a recorder step frame by frame
```

Layer CSS: `.L { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }`

### Hard technical rules

- **Everything is a function of the clock `t`.** No free-running CSS animation for anything the story depends on. This lets a recorder call `seek(t)` at 30 frames a second and get the same video every time.
- **No unseeded randomness.** Use a seeded generator so every render is identical.
- **Animate only `transform` and `opacity`.** Change `filter` only when the blur value changes.
- **Never put standing layers inside a CSS 3D context with the floor.** Pieces vanish. Only the floor is 3D; standing layers use the maths above.
- **Never put a CSS `filter` on an element inside a 3D context.**
- **Keep each layer under about 2000 px wide in layout.** Split long things (a bridge, a wall) into halves that overlap by 2 px.
- **Far layers can be drawn at half or a third size** and scaled back up with `data-s`. They are seen small, so nothing is lost.
- **Clip layers that must end at the ground** with `overflow:hidden`. SVG content leaks outside its box by default.
- **Layers must be wider than the frame.** Minimum half-width in world units is `800 * (P + d) / P` plus the furthest the camera travels sideways.
- **Budgets:** at most 20 layers in a shot and at most 6 blurred layers at once.
- **Prefix every id** inside an asset (gradients, masks, clips) with the asset name so two assets never clash.
- **Respect reduced motion:** if the viewer's device asks for less motion, hold one good still frame.

### Which engine to use

- **Vertical shorts with the fast camera (the default):** use the layer camera of section 8 and the engine of section 14, on a 540 x 960 stage, drawn as one SVG that is rebuilt every frame. This is the approved method.
- **Slow wide scenery shots with a true ground plane:** the reference engine above (depth `d`, lens `P`, a 3D floor) still works for a wide 1600 x 900 stage. Do not mix the two in one shot.
- In both, everything is a function of the clock `t`, and `window.seek(t)` must draw any exact frame.

## 4. World and depth rules

Depth is built from bands. Every shot uses at least three bands that overlap (foreground, hero, background) plus the ground.

### Depth bands

| Band | Depth `d` | What lives here | How it looks |
| --- | --- | --- | --- |
| Foreground frame | 100 to 300 | A branch, a lantern, a pillar, a window edge | Darkest, almost a silhouette, large, often soft |
| Hero | 350 to 500 | The main character and the main action | Full colour, full detail, sharpest |
| Middle | 700 to 1400 | Boats, trees, houses, other people | Fewer details, slightly hazed |
| Far | 1600 to 2200 | Hills, low mist, a town skyline | Pale, simple, no gold line or a faint one |
| Sky objects | 2000 to 2600 | Mountains, high mist, clouds, far aircraft, birds | Very pale at the base, simple shapes |
| Infinity | 2600 and beyond | Sun, moon, stars | Barely moves when the camera moves |

### What may be where

- **Clouds and high mist** stay in the sky: height above 300 and depth 1500 or more. Never put a cloud near the ground or in front of the hero.
- **Ground mist** is a different thing: thin wisps under height 100, only over water or fields, only at dawn, dusk or in fog.
- **Sun, moon and stars** are behind everything else.
- **Aircraft** are high and far unless the aircraft is the subject of the shot.
- **Boats** sit on water with their base on the water line. **Cars** sit on roads or on bridges built for cars. **People** stand on surfaces people can walk on.
- **Nothing floats.** Every object touches a surface and has a contact shadow under it.
- **Lamps and lanterns** are lit only at dusk, at night or in fog.

### Real sizes

| Thing | World size |
| --- | --- |
| Adult | 180 to 190 tall |
| Child | 110 to 140 tall |
| Car | 450 to 480 long, 135 high |
| Door | 210 high |
| Street lamp | 400 high |
| Tree | 600 to 1000 high |
| One storey of a building | 300 high |
| Small boat | 220 to 330 wide |
| Mountain in the sky band | 800 to 1200 high |

Very large far things (a mountain, an airliner in the sky) may be drawn smaller than life as long as their size on screen is believable. Check with the scale `f`: the same kind of thing must never look bigger when it is farther away.

### Distance haze

As depth grows, a thing gets lighter, closer to the sky colour, lower in contrast and simpler. Mix its colours toward the haze colour by about:

- 0% in the hero band
- 25% in the middle band
- 50% in the far band
- 70% at the base of a mountain, fading to 20% at its peak

The foreground does the opposite: darkest and most saturated.

### Overlap and edges

- Arrange pieces so nearer things partly cover farther things. Overlap is the strongest depth signal you have.
- Alternate light and dark from band to band: dark foreground, bright hero zone, mid-tone hills, pale mountain, bright sky.
- Mist bands sit between bands and slice across far things, so the eye can sort what is in front.
- Give the hero a calm, lighter area behind the head so the face reads.

## 5. Asset rules

An asset is one inline SVG, drawn in world units, with a bottom-centre anchor, a named light side and its moving parts in separate groups.

### Build order for any asset

1. **Purpose.** Where will it stand (which depth band), which way does it face, which side is lit?
2. **Silhouette.** Block the outer shape. It must read as solid black.
3. **Three tones.** Fill with a lit tone, a base tone and a shadow tone. The shadow tone goes on the side away from the light.
4. **Edges.** Add the gold line and a thin pale rim on the lit edge.
5. **One signature Deco detail.** A belt line, a fan, a stepped cap, a ring. One, not five.
6. **Moving parts.** Put each part that moves in its own group with a pivot point (wheels, doors, limbs, propellers, sails).
7. **States.** Put each on or off state in its own group with an id (lamp glow, headlights, door open, door closed).
8. **Test.** Check it on the cream sky and on dark water. Check it at the size it will appear on screen.

### Technical spec for every asset

- `viewBox` is in world units. Width and height match the real sizes in section 4.
- The anchor is the bottom centre: the point that touches the ground.
- It faces right by default. Flipping it with `scale(-1, 1)` also flips the lit side, so check the light again after any flip.
- Name: `gk-<category>-<name>-v<number>`, for example `gk-vehicle-coupe-v1`. Every id inside starts with that name.
- No text, no external references, no filters that are not needed.

### Detail budget by band

| Band | Shapes per asset | Notes |
| --- | --- | --- |
| Foreground frame | 15 or fewer | Near-silhouette with a gold rim on the lit side |
| Hero | 40 to 120 | Full three tones, gold line, moving parts |
| Middle | 15 to 40 | Two tones, thin gold line |
| Far and sky | 12 or fewer | One or two tones, haze at the base |

### Rules by category

**Vehicles**

- 1930s streamline shapes: long bonnet, rounded roof, separate curved wings over the wheels.
- Two-tone body, a gold belt line along the side, whitewall tyres with a gold hub.
- Windows carry a gradient of the sky colour of that scene.
- Wheels are separate groups so they can spin. A door that opens is a separate group hinged at its front edge.
- Headlights have a glow group that is off in daylight.

**People:** see section 6.

**Buildings and bridges**

- Japanese forms built from Deco geometry: stepped tiers, upturned eaves, gold caps on posts.
- A bridge for cars has a wide flat or gently cambered deck on solid piers. An arched red footbridge is for people only.
- A bridge is three layers: far rail, the deck zone where actors stand, near rail and deck face. The actors' layer goes between the rails.

**Nature**

- Pine: a dark winding trunk and flat cloud-shaped pads of needles, each pad with a lighter arc on top.
- Mountain: curved slopes that get steeper toward the peak, a snow cap with a jagged lower edge, a lit face and a shadow face split by a ridge line, haze at the base.
- Rocks: rounded dark masses with a gold rim on the lit side.
- Water: a smooth gradient, pale near the horizon and dark near the camera, with sparse, irregular, low-contrast horizontal streaks. No tiling pattern.

**Sky**

- Sun: a flat vermilion disc when low, pale gold when high, with one or two thin gold rings and thin rays that fade out.
- Moon: a pale gold disc with rings.
- Mist bands: long rounded bars stacked in pairs, cream with a gold hairline.
- Clouds: the same language, with a flat base and a scalloped top.
- Stars: small gold diamonds.

**Aircraft**

- A cream and silver 1930s airliner with a red stripe, indigo windows and a see-through disc for each spinning propeller.

**Props**

- Simple, one accent colour each, sized to the hand that holds them.

### Reuse

Assets are kept and reused across videos. Before making a new one, check the list of existing assets you were given and reuse or restyle a match.

## 6. Characters, faces and emotion

Every person is drawn by one shared function, `person()`, in the engine. You never draw a head, a face, a hand or a limb yourself. You only choose who it is, the pose, the feeling, the light and the body state, all by name.

### The one call you use

```js
place(CAST.medic, x, groundY,
      poseAt('kneel', t, 'worried', 'normal'),   // pose name, clock, feeling, body state
      faceAt('worried', t),                      // feeling name, clock
      { light:'left', state:'normal', headR:43, t, size:1 },
      flip);                                     // true = face left
```

- `x`, `groundY`: where the feet touch the ground.
- `headR: 43` always. This is the approved balanced head size.
- `size`: 1 is normal. The character's own `scale` (a child is 0.72) is applied on top.
- People face right by default. Pass `flip = true` to face left.
- `place()` also draws the ground shadow.

### Body plan (adult, in units)

| Part | Size |
| --- | --- |
| Thigh | 64 long, 27 wide |
| Shin and boot | 62 long, 23 wide, boot 12 high |
| Hip above ground | 138 |
| Torso | 104 tall, about 70 wide |
| Shoulder joint | 88 above the hip |
| Upper arm | 48 long, 21 wide |
| Forearm and hand | 36 long plus hand, 19 wide |
| Head radius | 43 (child: 43 x 1.12) |
| Whole adult | about 330 tall |

- Limbs are rounded bars (capsules). The coat is one curved shape. Clothes get one or two trims, no more.
- Draw order, back to front: back leg, back arm, front leg, torso and coat, head, front arm.
- A child is the same skeleton at scale 0.72 with a slightly bigger head.

### How joints turn

- Angles are in degrees, each joint measured from its parent.
- For a limb hanging down, a **negative** angle swings it forward (the way the person faces) and a **positive** angle swings it backward.
- A positive torso angle leans the body forward.

### The face

Positions are fractions of the head radius, with the head centre at 0,0 and the person facing right.

| Part | Where | Shape |
| --- | --- | --- |
| Near eye | 0.20, -0.02 | White oval 0.175 x 0.215 with a dark pupil and one white highlight |
| Far eye | 0.67, -0.04 | Same, smaller: 0.125 x 0.195 |
| Brows | Just above each eye | One thick rounded stroke, 0.10 thick |
| Nose | Right edge, 0.9 to 1.1 | A small darker wedge |
| Mouth | 0.46, 0.56 | Half-width 0.20. A curved line, an open shape, a round O, or gritted teeth |
| Cheeks | 0.08, 0.36 and 0.80, 0.32 | Soft red ovals whose strength follows the feeling |
| Ear | -0.84, 0.10 | Small darker oval |

Everything on the face is bold and few. Nothing thin, nothing tiny.

### Feelings (choose by name)

Brow tilt: plus means inner ends down (angry), minus means inner ends up (sad or scared). Eye open: 1 is normal.

| Feeling | Brows (tilt, lift) | Eyes | Mouth | Extras | What the body does |
| --- | --- | --- | --- | --- | --- |
| neutral | 0, 0 | open 1 | small smile line |  | relaxed |
| talking | -3, 2 | open 1 | opens and closes with speech |  | front hand gestures, open |
| happy | -4, 4 | upward arcs | wide open smile |  | chest lifts, head back a little |
| sad | -20, 1 | open 0.72, looking down | down-curved line | one tear | shoulders drop, head down |
| crying | -22, 3 | squeezed shut | wide open, turned down | tears streaming | both hands to the face |
| worried | -18, 4 | open 1.08, small pupils | slight down curve | sweat drop | fist to the chest, shoulders up |
| afraid | -16, 7 | wide 1.25, tiny pupils | open, turned down | sweat drop | leans away, hands up at the chest |
| shocked | -2, 10 | wide 1.3, tiny pupils | round O |  | jolts back, arms out |
| angry | 24, -3 | narrowed 0.8 | gritted teeth |  | leans in, both fists |
| shouting | 18, 2 | open 0.95 | fully open | shout lines | leans in, points |
| determined | 14, -1 | narrowed 0.85 | firm flat line |  | leans forward, fists |
| pain | 16, -2 | squeezed shut | gritted teeth | sweat drop | curls over, fist to the body |
| exhausted | -8, -2 | half shut 0.5, looking down | hangs open | sweat, breath cloud | slumps, arms hang |
| relief | -8, 3 | softly closed | small open smile | breath cloud | shoulders drop, head back |
| thinking | 6, 2 | looking up and away | pressed line |  | finger to the chin |
| limp | 0, 0 | closed | slightly open |  | none (unconscious) |
| groggy | -6, -1 | half open 0.42, looking down | flat, slightly down |  | head heavy, shoulders low (waking up, dazed, drugged) |
| wince | 18, 0 | squeezed shut | gritted, half open |  | a sharp short flinch, fist to the hurt place (a sudden pain) |
| hopeful | -10, 5 | open 1.08, looking up | small closed smile |  | chest lifts a little (waiting for good news) |

### Feelings change gradually, and people react

A face never snaps from one feeling to another. Give each person a **feelings arc** and let the engine blend it:

```js
const BOY = [[0,'limp'],[T('eyes'),'groggy'],[T('mother'),'hopeful'],[T('smiled'),'happy']];
place(CAST.boy, x, 0, poseAt('lying', t, feelName(t, BOY)), feelAt(t, BOY), X.who('cold', 1, 'side', P.COND.boy));
```

- `feelAt(t, keys, blend)` blends each change over `blend` seconds (0.4 if left out). `feelName(t, keys)` gives the feeling in charge, for `poseAt`.
- Real feelings move in steps: shocked, then afraid, then relieved. Never jump from happy to crying in one key.
- **Everyone reacts.** When something big happens (a shout, a crash, the heart restarting), every person in the shot reacts about 0.3 s later: a head turn, a step back, a hand to the mouth. `react(t, eventTime)` gives 0 before and 1 after, already late by 0.3 s, so `easePose(calm, startled, react(t, T('crack')))` does it.
- **Eyes go to what matters**: the patient, the screen, the danger, the person speaking. Nobody stares at nothing.
- Pain shows on the face **and** the body: wince or pain, a hand on the hurt place, slow moves, `limpWalk` for a hurt leg.
- Cold shows: `cold` state, blue lips, breath cloud, shiver, arms wrapped.

### Hands

Four shapes only: `relaxed`, `fist`, `open`, `point`. The pose or the feeling picks one. A gloved character uses one mitten shape for all four.

### Poses (choose by name)

| Pose | Use it for |
| --- | --- |
| stand | Default. Weight slightly on one leg |
| walk | Walking. The legs follow the clock, about 5.4 radians a second |
| run | Running. Bigger swing, body leans 17 degrees, fists |
| reach | Reaching forward for something |
| carry | Holding something in both arms |
| pull | Leaning and pulling something behind (a sled, a rope) |
| crouch | Low, knees bent, hands forward |
| sit | Sitting on the ground, legs out |
| kneel | Kneeling with both arms straight down (chest compressions pump with the clock) |
| lying | Flat on the back, head to the left |
| fall | Tipped over, arms and legs flailing |
| cheer | Both arms up in a V |
| limpWalk | Walking on a hurt leg: slow, the back leg stays stiff, the body dips on each step |

The worked example adds six more for its scene: `kneelHold`, `kneelCheck`, `runCarry`, `float`, `shout`, `haul`. Add a new pose the same way, as one entry with these fields:

```js
POSES.shout = { root:[0,0],        // [drop of the hip in units, turn of the whole body in degrees]
                torso:11, head:-6,
                aF:[-98,-16],      // front arm: [upper arm, forearm]
                aB:[16,-28],       // back arm
                lF:[-10,4],        // front leg: [thigh, shin]
                lB:[12,2],         // back leg
                hF:'point', hB:'fist' };
```

Blend between two poses with `easePose(poseA, poseB, k)` so nobody snaps from one to the other.

### The whole body acts

A feeling moves the body as well as the face. How much depends on the pose: fully when standing, about half when walking, a little when running or carrying, and not at all in fixed poses such as kneel or lying. `poseAt(name, t, feeling, state)` does this for you, so always pass the feeling.

### Body states and conditions

What has happened to a person shows on them, and **stays** until the story changes it. Pass it as the fourth option of `X.who(state, size, view, cond)`:

```js
const P = PART({ id:3, ..., COND: { boy: { wet:1, cold:1, frost:.6, pale:.5 }, medic: { dirt:.4, sweat:1 } } });  // the state sheet row at the start of the part
place(CAST.medic, x, 0, pose, face, X.who('normal', 1, 'side', P.COND.medic));
const cBoy = t < T('blanket') ? P.COND.boy : { ...P.COND.boy, wet:0, frost:0 };            // a change inside the part happens on its word
```

| Condition | Value | What it draws |
| --- | --- | --- |
| cold | 1 | Skin 62% toward pale blue-grey, blue lips, breath cloud, fast small shiver, shoulders up, arms wrapped when standing (same as the `cold` state) |
| wet | 1 | Clothes and hair about 30% darker, drips (same as the `wet` state). `cold` and `wet` can be on together |
| frost | 0 to 1 | White frost specks on the hair, hat and shoulders |
| pale | 0 to 1 | Skin drained toward grey (shock, blood loss, very ill) |
| sweat | 1 | A sweat drop, whatever the feeling |
| dirt | 0 to 1 | Brown dirt or mud patches on the coat, legs and cheek; muddy boots (a fall, a crash, a long walk, a rescue in mud) |
| soot | 0 to 1 | Dark grey smudges on the coat, legs and face (a fire, smoke, an explosion) |
| torn | 0 to 1 | Rips in the coat and the trousers at the knee (a fall, an attack, a crash) |
| bruise | 0 to 1 | A blue-purple mark on the cheek |
| blood | 0 to 1 | A small dark red stain (on a bandage, the coat or a thin line from the forehead). Simple paper shapes, never gory |
| bandage | `'head'`, `'armF'`, `'armB'`, `'legF'`, `'legB'` or a list | A cream wrap with a gold edge on that place (F = the arm or leg nearer the camera) |
| sling | 1 | The near arm held across the body in a cream sling |

- Marks sit in the same place in every shot, because they are placed from the person's name.
- A change of clothes (a hospital gown, a dry blanket) is a new cast entry made from the old one: `CAST.boyGown = {...CAST.boy, kind:'gown', coat:'#A9B9D0', coatLen:58, hat:'grey'}`. `kind:'gown'` draws the gown's pattern and neckline.
- Conditions follow cause and effect: out of the water means wet and cold; a crash means dirt, torn and maybe a bruise; a fire means soot; a medic's treatment brings a bandage. Section 10 says how to track them across parts.

### Light on a person

Set `light` to where the main light is: `left`, `right`, `back` (the light is behind them) or `night` (dark, with a warm lamp on the right).

- Three tones per part: a lit tone (24% toward #FFF1CF), the base colour, and a shadow tone (32% toward #131A38).
- The lit band is the 17% of the part nearest the light. The shadow band is the 20% farthest from it. With `back`, both edges are base and the middle is shadow.
- A pale rim (#FFEFC2) sits 2.3 units outside each part on the lit side.
- With `night`, every colour first moves 42% toward #0C1630, and the lit tone is warm (#FFD080).
- The ground shadow sits 34 units away from the light, at about 26% strength.

### Small life

- A blink every 3.6 seconds, lasting 0.13 seconds.
- A slow breathing bob when not walking.
- Talking: the mouth opens and closes on an uneven rhythm, never a steady flap.

### The cast sheet

One entry per person. Reuse it unchanged in every shot.

```js
CAST.medic = { name:'Medic', scale:1, headK:1, skin:'#E5BE98', hair:'#3A2416',
               coat:'#2F4A7A', coatLen:8, legs:'#1B2A4A', boots:'#0C1630',
               hat:'cap', kind:'medic' };
```

- **Tell people apart by one hat or hair shape and one coat colour** that nobody else in the video has.
- `kind` picks the trims on the coat (stripes, zip, belt, scarf, stethoscope; `gown` for a hospital gown). `coatLen` is how far the coat hangs below the hip.
- Hats and hair today: `beanie`, `cap`, `bun`, `grey` (short hair). Add a new one inside `person()` next to these, using the same head box.
- Wardrobe, hair and props follow the story's own time and place.
- True stories: show real people's skin tone and most recognisable features accurately and with respect.
- Invented characters: follow the channel's casting setting given with the request. If none is given, cast to fit the story's place and people.

### Limits today

- People can be drawn from the side, the front and the back (section 18). There is no view from above and no three-quarter view. Section 24 says how to stage every kind of scene, and how to do crowds, babies, animals, vehicles and rooms.
- When the head is under 25 px on screen, the face cannot be read. Do not frame people that small except in a short wide shot.

## 7. Light, shadow and time of day

Every scene has one main light with a real position in the world, and every highlight, shadow, glow and sky colour must agree with it.

### Declare the light before you draw

For each scene write a **light sheet**:

- Time of day and weather.
- The main light: sun or moon.
- Its direction: left, right, behind the subject (backlight) or behind the camera (front light).
- Its height: low, middle or high.
- Which local lights are on (lamps, lanterns, headlights, windows, fire).

### What the main light controls

All of these must point to the same light:

1. **Lit edge.** The gold line and the pale rim sit on the side facing the light.
2. **Shadow side.** The darker tone sits on the side away from the light.
3. **Cast shadows.** They fall on the ground away from the light. Draw them on the ground plane so they stay correct when the camera moves.
4. **Shadow length.** Length = object height / tan(light height angle). A low sun gives long shadows, a high sun gives short ones.
5. **Reflection.** On water, a column of light runs from under the sun toward the camera.
6. **Glow.** A soft glow sits at the sun's place on screen. When the sun is behind the subject, the glow spills slightly over the edges of the silhouettes in front of it.
7. **Sky.** The sky gradient is brightest and warmest near the light.

### Three kinds of shadow

| Shadow | When | How to draw |
| --- | --- | --- |
| Contact shadow | Always, under everything that touches a surface | A small soft dark ellipse right at the base |
| Cast shadow | Whenever a main or local light exists | A soft navy shape on the ground, 20 to 35% strength, pointing away from the light |
| Form shadow | Always | The shadow tone on the side away from the light |

Shadows are navy or plum tinted, never pure black. A cast shadow lands only on a surface that is really there, and it bends up a wall it meets.

### Time-of-day colour scripts

| Time | Sky top | Sky at horizon | Light colour | Shadows | Lamps | Mist |
| --- | --- | --- | --- | --- | --- | --- |
| Dawn | Deep indigo | Peach to pink | Soft warm | Very long, faint | Fading out | Ground mist allowed |
| Morning | Mid blue | Cream | Warm white | Long | Off | Thin, lifting |
| Noon | Pale blue | Pale cream | White | Short, crisp | Off | None |
| Golden hour | Blue-grey | Deep peach and gold | Gold | Long, warm edges | Off | Light haze |
| Dusk | Plum | Vermilion to orange | Dim orange | Long, soft, fading | Turning on | Ground mist allowed |
| Night | Near black-green or navy | Deep indigo | Pale moon gold | Faint, short, from the moon | On | Low mist allowed |
| Overcast or storm | Grey-indigo | Grey-cream | Flat, cool | Contact shadows only | On if dark | Fog allowed |

### When time passes

Drive everything from one value: the hour of the day. When it changes, change all of these together and smoothly:

- The sun or moon position along its arc.
- The sky gradient.
- The direction and length of every cast shadow.
- The lit side of objects if the light crosses over them.
- Lamps, windows and headlights turning on or off.
- Stars fading in or out.

Never move the sun without moving the shadows. Never darken the sky without turning on the lights people would turn on.

### Darkness

- Darkness is lower brightness, cooler colour and less saturation. It is not a black layer over the picture.
- The subject must stay readable: at least 25% brighter or darker than what is right behind it.
- At night, each local light makes a glow around itself, a pool of warm light on the ground, a warm rim on nearby objects and its own short shadows pointing away from it.
- A face in the dark is lit by the nearest light source and from that side.

### Weather

- Rain: thin slanted streaks in two depth bands, darker wet surfaces, soft reflections, no hard cast shadows.
- Fog: strong haze starting in the middle band, far bands almost gone, lamps with large halos.
- Snow: slow flakes in three depth bands with different sizes and speeds, snow sitting on top surfaces only.
- Wind: trees, cloth, smoke and water streaks all lean the same way.

### Light tells the story

Light is a storytelling tool, as important as the camera. The mood of the light changes when the story turns, on the word where it turns. A video whose light never changes is flat, however good the drawing is.

A **mood** is one named set of values that are always changed together:

| Mood | Sky (top, middle, low) | Ground (near, far) | Colour wash over the frame | Light on people | Dark corners | Use it for |
| --- | --- | --- | --- | --- | --- | --- |
| day | #2B4573, #E6D7AE, #F5C59A | #F2EDE2, #D9D3C8 | warm #FFE9C4 at 16% | left | 30% | Normal life, before trouble |
| night | #0B1430, #263A6B, #6E7FB0 | #C9D3E6, #8E9CC2 | cool #AEB9E6 at 34% | left (moon) | 50% | Cold, danger, waiting |
| heavy | #070D22, #1B2A54, #4E5E92 | #B4BFD8, #76849F | #8794C8 at 52% | left | 72% | The worst moment: no pulse, loss |
| lamp | #060B1C, #1A274E, #4A4470 | #C7BFC9, #7C7896 | warm #D9B8A6 at 30% | night | 60% | Help arriving, a person taking charge |

Make new moods the same way (for example `hope`: brighter, warmer, lighter corners; `hospital`: pale teal, even light). Keep to the palette of section 2.

Rules for using moods:

1. **Write a light plan** next to the shot list: which mood each beat is in, and the word where it changes.
2. **Blend between moods** over 0.3 to 1.5 seconds. Never switch instantly, except for a flash.
3. **The colour wash** is one rectangle over the whole frame with multiply blending. It ties every layer into one mood.
4. **Darker and heavier** as things get worse. **Warmer and brighter** when help or hope arrives.
5. **Time passing is shown with light.** To show hours go by, move the sun down and the moon up, change the mood from `day` to `night`, and swing the shadows, all in one or two seconds.
6. **A light source in the story lights the scene.** A lamp, headlights or a doorway add a warm glow on that side (a soft oval, screen blending) and switch people to `night` light so their rim faces it.
7. **Emergency lights** are a very faint red and blue wash that alternates about once a second, at 7% strength or less. Never a hard strobe.
8. **A flash** marks the single biggest moment: a pale full-frame wash at 50% that fades out in 0.22 seconds. Use it once or twice in a whole video.
9. **Underwater, a cave, a dark room:** nearly black, with one shaft or pool of light, and the person as a dim shape inside it. This is also how to show things that should not be shown plainly.
10. **Dark corners** (a soft dark oval frame) pull the eye to the centre. Stronger in dark moods, lighter in bright ones.

The rules earlier in this section still hold inside every mood: one main light, lit sides face it, shadows fall away from it.

## 8. Cinematography

**Read this first.** The engine in this file already does the camera easing, the motion blur, the micro shake, the captions and the joins, with the numbers written in this section. The numbers are here so you understand what you will see. Never code them again inside a part. You only choose: the keys, the sizes, the hits, the moods and the words (section 14).

The camera never rests. It shows a new picture every 1 to 2 seconds, keeps people large in the frame, and flies from one thing to the next through blurred whips instead of cutting. Each beat still has one purpose, written as one sentence.

These rules are for vertical 9:16 shorts on a 540 x 960 stage. They are measured from a short with 5 million views, and from the approved worked example in the engine.

### Pacing

- **A new picture idea every 1 to 2 seconds.** A beat is one idea: one thing shown, one action, one feeling.
- A 20-second passage has 9 to 12 beats.
- **The first frame is the hook.** Open on the strangest or most exact thing the narration names first. No intro, no establishing shot before it.
- Never show the same unchanged picture for more than 2 seconds. Inside a longer beat something must change: an arm drops, skin changes colour, the camera pushes.
- A beat starts on the word that names its subject, or up to 0.15 seconds before it.
- End on the biggest image. No wind-down.

### The camera

The camera is three numbers: `x` (where it looks, sideways), `y` (how high it looks) and `s` (zoom).

- A point on the subject plane lands on screen at: `X = 270 + (wx - x) * s` and `Y = 610 + (wy + y) * s`, where the ground is `wy = 0` and up is negative.
- So with `y = 0` the ground sits at 610, about two thirds down the frame. Raising `y` moves the view up to faces.
- The world is built from layers. Each has a depth factor `f`:

| Layer | `f` | Holds |
| --- | --- | --- |
| Sky objects | 0.05 | Sun, moon, glow |
| Far | 0.14 | Hills, big far trees, high mist |
| Middle | 0.5 | Shoreline, nearer trees, far buildings |
| Subject | 1 | Ground, people, props, vehicles |
| Foreground | 1.7 | Two or three large dark soft shapes at the bottom corners |

- A layer is drawn as: `translate(270, 610) scale(k) translate(-x * f, y * f)`, where `k = 1 + (s - 1) * f` for `f` up to 1, and `k = s * f` for the foreground.
- This makes far layers slide and grow less than near ones. That difference is the depth.
- To place something in a far layer behind world position `wx`, draw it at `wx * f` in that layer.

### Framing sizes

| Size | Zoom `s` | What fills the frame | Use it for | Longest hold |
| --- | --- | --- | --- | --- |
| Detail | 5.5 to 6.5 | A small object fills two thirds of the width | A reading, a hand, a key prop | 2.5 s |
| Face | 4 to 4.8 | One head fills two thirds of the width or more | A feeling, a body state | 2.5 s |
| Close | 2.8 to 3.7 | Head and chest | Speech, a shout, a reaction | 3 s |
| Medium | 2 to 2.6 | One person from the knees up, or two people together | Action between people | 3.5 s |
| Full | 1.8 to 2 | One whole person | Running, carrying, falling | 3 s |
| Wide | 1.2 to 1.5 | The place | Where we are, time passing | 2 s |

- **People are large.** The main person is at least one third of the frame height in every size except Wide.
- Wide shots are rare and short. Never two in a row.
- Change size clearly from beat to beat (Detail to Medium to Face). Never the same size twice in a row on the same subject.
- No large empty areas. If a third of the frame holds nothing, move in or add a foreground shape.

### One continuous path

The camera follows one list of keys for a whole place: `[time, x, y, s]`.

- Between keys, ease with smoothstep: `u = k*k*(3 - 2*k)`. Move `x` and `y` in a straight blend. Blend zoom as a ratio: `s = s0 * (s1 / s0) ** u`.
- Two keys close together in time (0.25 to 0.35 s apart) make a **whip**. Two keys far apart make a slow **creep**.
- **Never perfectly still.** During every hold the zoom creeps 3 to 8% and the aim drifts a few units.

### The moves

| Move | How | Use it for |
| --- | --- | --- |
| Creep | Zoom or aim changes slowly over the whole beat | Every hold. Rising tension |
| Whip | Jump to the next subject in 0.25 to 0.35 s, with strong blur | Joining one beat to the next |
| Snap push | Zoom up 1.5 times or more in 0.15 to 0.2 s, on a key word | The hardest-hitting word |
| Pull back | Whip outward to a smaller zoom | Revealing who or what is around |
| Track | `x = subject x - 64` every frame, so space stays in front of the mover | Running, walking, driving |
| Dive or rise | A vertical whip of 0.25 s, down or up, that ends in a new place | Going under, going in, leaving a place |
| Special shots | `ZOOM.dive`, `ZOOM.pull`, `ZOOM.xray` and the other calls of section 30 | Going inside a thing, showing the inside, showing size, at most one every 15 seconds |

- **Joins are whips, not cuts.** Inside one place, never cut. Between two places, swap the place at the middle of a whip, hidden by the blur.
- A hard cut is allowed only for a jump in time or a planned shock, at most once every 20 seconds.
- Keep screen direction. Someone travelling left keeps travelling left through the whip into the next beat.
- When someone looks or travels one way, keep them off-centre with the open space in front of them.
- No camera rotation or roll, ever.

### Motion blur

Motion blur is what makes the fast camera feel smooth instead of jumpy. It comes from speed, never from mood.

- Each frame, work out the camera speed on screen: `vx = (x - x_prev) * s * 60` and the same for `vy` (pixels a second).
- **Whips:** blur every layer along the direction of travel.
  - Subject layer: `min(46, speed / 150)` pixels.
  - Far and middle layers: `min(40, speed / 190)`.
  - Foreground: `min(60, speed / 110)`.
- **Tracking:** the person being followed stays perfectly sharp. Blur only the background, about 9 px sideways, and the foreground, about 26 px.
- **Dive or rise:** blur 26 px vertically for the 0.3 seconds on each side of the swap.
- Below 0.6 px, switch the blur off.
- Build it with one SVG filter per layer group: `feGaussianBlur stdDeviation='bx by'`, with a filter area larger than the frame.
- Never blur captions. Never blur a held picture.
- Fast things inside the scene get their own blur: a spinning wheel becomes a soft disc, a thrown object leaves a short fading streak.

### Micro shake

Micro shake makes the camera feel held by a person and makes hard moments land.

- **Always on:** a tiny drift of the whole picture.
  - `sx = 1.5*sin(6.1t) + 0.9*sin(13.7t + 1.3)`
  - `sy = 1.3*sin(5.3t + 0.7) + 0.8*sin(11.9t)`
  - That is under 2.5 px each way on a 540-wide frame.
- **Hits:** a short jolt on an impact or a key word.
  - For 0.5 s after the hit time: `k = amp * exp(-9d)`, then `sx += k*sin(58d)` and `sy += 0.8*k*cos(47d)`, where `d` is the time since the hit.
- Hit strength:

| Moment | Strength |
| --- | --- |
| A heavy word, a quiet thud | 3 |
| An arrival, a drop, a grab | 4 to 5 |
| The opening hook word | 7 |
| The single biggest moment | 10 to 11 |

- At most one hit every 2 seconds, and one biggest hit per 20 seconds.
- Move the picture only. Captions do not shake.
- Shake is sideways and up-down only. Never rotate.

### Depth and focus

- Every beat has at least three layers in view: something far, the subject, and a dark foreground shape.
- Foreground shapes are large, dark, simple and at the bottom corners. They never cover a face.
- The subject is always the sharpest, brightest, most colourful thing in the frame.
- Never blur the subject, a speaking face, or the thing the narration names.

### Showing the words

- Every phrase gets a picture that shows it literally, on its word: a number counts to the number said, skin changes colour on the word cold, an arm drops on the word limp.
- Use colour as a signal when the story is about something invisible (heat, cold, time, danger). State the code once and keep it.
- Text appears only on real objects: a screen, a sign, a page. No title cards.
- Numbers and ideas have a fixed look: instruments and explainer pictures, section 25.

### Captions

- **One or two words at a time.** Join two words only when together they are 9 letters or fewer and no comma or full stop sits between them.
- Heavy rounded sans (Archivo Black or similar), 58 px on the 540-wide frame, centred, baseline at y = 728.
- White (#FFFDF4) with a 13 px dark outline. **Key words in gold (#F6C956).** Key words are the nouns, numbers and verbs that carry the story.
- Each caption pops in: scale 0.82 to 1 in 0.09 seconds. Strip commas and full stops.
- The biggest line of the video is 1.28 times larger.
- Captions are drawn last, above everything, and are never blurred or shaken.

### What must never happen

- No dense repeating pattern on any moving surface. This is what makes viewers feel sick, far more than camera speed.
- No rotation or roll. No zoom in and out on the same subject twice in a row.
- No whip longer than 0.35 seconds. A slow blurry pan is the sickening kind.
- No people so small that their faces cannot be read, outside a short Wide.
- No still frame held over 2 seconds.

### Wide 16:9 videos

The numbers in this section are for the vertical stage. A wide 16:9 project is set in the plan with `"stage": "wide"` (section 26). The engine then uses its own wide numbers for the centre, the captions and the `shot()` sizes. You change nothing by hand.

## 9. Motion and animation

All motion comes from one clock, obeys weight and cause, and stays gentle enough that no viewer feels sick.

### Timing basics

- Use ease-in-out for anything that starts and stops. Use constant speed for steady travel: walking, a flying aircraft, drifting mist.
- Before a big move, add a small opposite move (a crouch before a jump, a lean back before a step).
- After a stop, let loose parts settle a moment later (a coat hem, an umbrella, a car body on its springs).
- Parts of one body do not all move at the same instant. Offset them by 0.05 to 0.15 s.
- Let important poses hold still long enough to read.

### Speeds in world units per second

| Movement | Speed |
| --- | --- |
| Slow stroll | 60 to 90 |
| Normal walk | 120 to 150 |
| Run | 350 to 450 |
| Car in town | 600 to 1200 |
| Mist drift | 2 to 4 |
| Boat on calm water | 10 to 30 |

Far things look slower because the scale `f` shrinks their movement. Let the projection do that; do not fake it.

### Walking

- About two steps a second at a normal walk, slower for a stroll.
- **Feet must not slide.** Stride length = speed x step time. Match the leg swing to the distance covered.
- Legs swing about 17 to 22 degrees each way from the hip. Arms swing the opposite way, about 12 degrees.
- The body bobs about 3 units, twice per full cycle, and leans slightly into the direction of travel.
- To stop: slow over 0.3 s, bring the feet together, let the body settle.

### Vehicles

- Wheel turn = distance travelled / wheel circumference. Wheels never spin on a parked car.
- A car dips slightly when someone gets in and when it brakes, and lifts slightly when it pulls away.
- A door swings on its hinge with an ease, and stays open until someone closes it.
- An aircraft banks into a turn and its propellers are discs whenever the engines run.

### Example of a complete action: getting into a car

1. Walks up to the door and slows.
2. Stops, feet together, looks at the handle.
3. Reaches. The hand meets the handle.
4. The door swings open toward the camera side.
5. Turns, lowers the body, ducks the head under the roof line.
6. Sits. The car dips a little.
7. Pulls the legs in. Pulls the door shut. The car settles.
8. Headlights come on only if the light sheet says it is dark.
9. A short pause, then the wheels start to turn and the car eases away.

Never skip the middle of an action. A person does not vanish outside a car and appear inside it.

### Background life: every scene is alive

A still picture with a moving camera looks fake. Every shot has small life in it, and every asset that would move in the real world moves by itself.

- **People:** they blink, breathe and shift a little even when standing (the engine does this). Feelings arcs and reactions keep faces changing (section 6).
- **Nature:** trees sway less than one degree, mist drifts, water ripples, snow and rain fall, leaves and grass move, clouds pass, birds cross far away.
- **Machines and lights:** monitor lines run, beacons flash, lamps and fires flicker, screens glow, fans and wheels turn, clock hands move, smoke rises.
- Give these loops different lengths (for example 4.5 s, 5.6 s, 7 s) so they never line up into a visible pulse.
- Background life must never pull the eye away from the subject.
- Complete stillness only on purpose: a freeze frame, the frozen moment of shock, a thing that is truly still (a board lying on the ground, a wall).

Assets get their clock from `LIFE.t(o)` (the frame's time, or `o.t` if the part passes one), so they move even when a part forgets to pass `t`. The helpers keep every model's motion the same:

| Helper | Gives | Use it for |
| --- | --- | --- |
| `LIFE.sway(t, amp, speed, phase)` | a gentle back and forth | trees, lamps, flags, hanging things, hair in wind |
| `LIFE.bob(t, amp, speed, phase)` | up and down | boats, floating things, idling engines |
| `LIFE.flicker(t, phase)` | strength 0.72 to 1, uneven | flames, old bulbs, screens, candles |
| `LIFE.blink(t, period, on, phase)` | true while lit | LEDs, beacons, cursors, warning lights |
| `LIFE.drift(t, speed, length, phase)` | 0 to length, looping | mist, clouds, smoke, snow, bubbles |
| `LIFE.pulse(t, bpm, phase)` | 1 on the beat, fading | heartbeats, alarms, a glowing button |
| `LIFE.spin(t, turnsPerSecond, phase)` | degrees | wheels, fans, clock hands, propellers |

Use the asset's `x` (or a number from its name) as the phase, so two trees side by side never move together.

### Viewer comfort rules

These are strict. Breaking them makes viewers feel ill.

- No dense repeating pattern on any surface that moves across the frame, above all on the ground or water. This matters more than camera speed.
- No camera rotation or roll.
- Whips are short: 0.25 to 0.35 seconds, with motion blur. A slow blurry pan is the sickening kind.
- No flashing or flicker faster than three times a second on large areas. Brightness pulses stay under 10%, except the one planned flash.
- No thin high-contrast lines sliding slowly across the frame.
- Micro shake stays under 2.5 px between hits, and a hit never exceeds 11 px.
- Every move eases in and out, even a whip.

### Captions, when asked for

- Follow the caption rules in section 8: one or two big words, key words in gold, popped in on the word.
- Captions sit in the lower middle of the frame and may overlap a body, but never a face and never text on an object.
- Captions are never cut off, never blurred and never shaken.

## 10. Logic rules

The whole picture must make sense from the first frame to the last: every object, light, shadow, movement and effect needs a reason that a viewer would accept without thinking.

### Physical logic

- Things rest on surfaces that can hold them. A car needs a road. A boat needs water.
- Sky things stay in the sky. No clouds near the ground. No sun in front of a mountain.
- Sizes agree with distance. Nearer is bigger.
- Wind, rain and smoke all go the same way.
- Reflections appear only on water, glass and polished surfaces, and only of things that are really there.
- Weather fits the season and place the story gives.

### Light logic

- One sun or one moon, in one place, at any moment.
- Shadows point away from the light and their length fits its height.
- Lit sides face the light.
- Lamps are off in daylight. Headlights are on at night.
- An umbrella is open in rain, or as a sunshade in strong high sun. It is closed otherwise.
- If it gets darker, there is a cause: the sun set, a cloud came, the character went indoors.

### Time logic

- Time moves forward unless the story says otherwise.
- The sun and shadows move only as fast as story time moves. In a 20-second scene of real time they do not move at all.
- Day to night happens through dusk, never in one jump inside a shot.
- What changed stays changed: an opened door stays open, a wet coat stays wet, a lit lamp stays lit.

### Cause and effect

- Every action has a start, a middle and an end on screen, or a cut that clearly skips it.
- An effect follows its cause: a splash after something hits water, a dip after someone sits, dust after a wheel spins.
- A character looks at a thing before reacting to it.
- Nothing appears or vanishes in view without a cause.

### Narration match

- List every concrete thing the narration names: objects, numbers, body parts, colours, actions, places, weather.
- Each one is visible at the moment it is spoken, shown literally and correctly. If the narrator says "his left hand", it is the left hand.
- A number that is spoken and shown (a temperature, a depth, a time) matches exactly, and changes on screen if the story says it changes.
- The picture arrives 0.1 to 0.3 s before the word, never after.
- Never show something that contradicts the words.

### Camera and effect logic

- Sharp focus is on what the shot is about. Blur is on what it is not about.
- Motion blur only on fast things.
- A camera move has a reason: to follow, to reveal, or to end.
- A glow needs a light source. A shadow needs a light and a surface.

### The continuity ledger (the state sheet)

What happened stays happened. The plan keeps one table for the whole video, **part by part**, and every part draws exactly what its row says. A change is allowed only at the moment the story causes it, and the row says why.

| Track | Example |
| --- | --- |
| Time of day and weather | Early morning, clear, light wind from the left |
| Light | Low sun, behind and left of the subject |
| Each character's conditions | Part 2: boy wet, cold, frost .6, pale .5 (pulled from the water). Part 4: blanket over him (wrapped by the medic) |
| Each character's injuries | Part 3: medic bandage armF, blood .3 (cut on the ice); stays to the end |
| Each character's place and facing | Boy on the board, head to the left; medic kneeling at his right |
| What each person holds | Medic: thermometer in the near hand until part 3 |
| Each character's feeling | Part 1 afraid, part 2 determined, part 5 relief |
| Each vehicle and door | Ambulance parked, engine on, back door open |
| Lights | Beacon flashing, lantern off |
| The world | The ice hole stays broken; footprints and the sled's track stay in the snow |
| Screen direction | Rescuers travel left to right |

In the project plan this is `state` (each person's start and every change: part, word, what is set, why), `arcs` (each person's feelings, part by part), `world` (lasting changes to the place) and `effects` (what each big event must show). Each part copies its row into `PART({... COND: {...}})` (section 6), draws everyone with `X.who(state, size, view, P.COND.name)`, switches changes on at their words, and follows the arcs with `feelAt`. Check each new shot against the sheet before writing it.

### Common mistakes and the fix

| Mistake | Fix |
| --- | --- |
| Lantern glowing at midday | Turn it off, or move the scene to dusk |
| Car on a narrow arched footbridge | Use a flat car bridge, or park the car at the end of the footbridge |
| Shadows on the wrong side of a backlit figure | Shadows come toward the camera when the sun is behind the subject |
| Mist band crossing in front of the hero | Move it back behind the middle band |
| The subject is the blurred thing | Set `F` to the subject's depth |
| Person fades out at a car | Animate the full getting-in action |

## 11. Planning from a passage or audio

A plan turns words into a timed list of shots, a light sheet, character sheets and asset tickets, so that different chats or models can build the pieces and they still fit together.

### What you need

- A passage or script, or an audio transcript with a start and end time for each sentence.
- The target shape: wide 16:9 or vertical 9:16, and the total length.
- If you are given audio you cannot hear and no transcript, ask for the transcript with timestamps. That is the one case where you stop and ask.

### Planning steps

1. **Understand.** Write one line for what the story is, one line for its mood, and note the place, the period, and any facts that must be right.
2. **Beats.** Split the words into beats. One beat is one idea or one action. Give each its time range.
3. **Places and time.** Group the beats by place. Each place becomes one continuous sequence with one light sheet.
4. **Hook.** The first 3 seconds show the most striking image the story has.
5. **Shots.** For each beat, write the purpose sentence, then choose the shot type, lens, camera height, move, focus subject and aperture from section 8.
6. **Literal list.** Under each shot, list every concrete thing the narration names in that time range. Each must be on screen then.
7. **Camera path.** Inside one place, join the shots into one camera path with keyframes: time, `x`, `y`, `z`, `P`, `F`, `A`, `o`.
8. **Assets.** List every asset once. Mark which already exist and can be reused. Grade each new one: Hard, Medium or Simple.
9. **Tickets.** Batch the new assets: a Hard asset gets its own ticket, Medium assets go 2 or 3 to a ticket, Simple assets go 4 to 6 to a ticket.
10. **Ledger.** Fill the continuity ledger from section 10 for the start of each sequence.
11. **Check timing.** Shot lengths add up to the audio length. Cuts land on the gaps between sentences or phrases.
12. **Risks.** Note anything hard to show and how you chose to show it.

### Timing rules

- One beat every 1 to 2 seconds. A beat is one picture idea.
- Never hold one unchanged picture longer than 2 seconds.
- One continuous camera path per place, joined by whips. A path may run 20 to 30 seconds without a cut.
- Start each beat on the word that names its subject, or up to 0.15 seconds before it.
- The first frame is the hook. The last frame is the biggest image.

### Vertical 9:16 differences

- Stage 900 x 1600. Depth is stacked up the frame: ground at the bottom, hero in the middle, sky above.
- Keep the subject within the centre 70% of the width.
- Prefer rises and push-ins. Sideways tracking has little room.
- Captions sit in the lower middle, clear of the bottom 15% and of the subject.

### One video, several cuts

When asked for a long video plus short clips from it, mark in the plan which shots can stand alone as a short, and plan them so the same assets are reused with no new builds.

### What a ticket must contain

A ticket is given to a separate chat that has this rulebook but nothing else. It must stand alone:

- Asset name and category.
- The depth band, the facing and the lit side.
- The exact size in world units.
- The palette roles to use.
- The moving parts and the states needed.
- The light sheet line for the scene it appears in.
- For a character: the full character sheet.

### Timing words when you have no word-by-word transcript

If you only have the script and the audio, estimate each word's time from the pauses.

1. Find the pauses in the audio (for example `ffmpeg -af silencedetect=noise=-38dB:d=0.12`). The sound between two pauses is one **segment**.
2. Match each segment to the words spoken in it. Pauses fall at full stops, commas and breaths.
3. Inside a segment, give each word a weight: its number of letters, plus 1.6, plus 2 more if it ends in a comma, colon or full stop.
4. Share the segment's time between its words by weight.
5. Take every beat time from a word, for example `tNot = T('not')`. Then the camera, the light and the captions stay locked to the voice even if the estimate is slightly off.

Write every `SEG` time in full-audio seconds and set `AUDIO_START` (section 15). Say in your assumptions that the timing is estimated.

### The plan for a fast vertical short

For each beat write one line with these seven things:

| Field | Example |
| --- | --- |
| Time and words | 7.4 s, cold as stone |
| Purpose | Show how cold he is |
| What is seen, literally | His face fills the frame and drains to blue-grey |
| Framing size | Face, zoom 4.2 to 4.8 |
| Camera move | Slow creep in |
| Light | Mood night, leaning toward heavy |
| Effects | No hit. Cold state switches on at 7.3 s |

Then list the camera keys, the hit list and the mood changes as plain numbers, as in section 14.

## 13. Final self-check

Run this list before you deliver anything. Fix every failure first, then deliver. In SCENE mode, print the list with pass or fixed beside each line.

### Purpose and story

- [ ] I can state the purpose of each shot in one sentence.
- [ ] Everything the narration names is on screen at the moment it is spoken, shown literally and correctly.
- [ ] Nothing on screen contradicts the words.
- [ ] Every action has its start, middle and end, or a clear cut.

### Style

- [ ] Only palette colours are used, shifted for depth and time of day.
- [ ] Every object reads as a solid black silhouette.
- [ ] Three tones and a gold line on the lit edge. No black outlines.
- [ ] Gold is a line or a small trim. At most two strong red objects.
- [ ] No dense repeating pattern on anything that moves. No sparkles, neon or photo texture.

### Depth

- [ ] At least three overlapping bands plus the ground.
- [ ] Far things are paler and simpler. The foreground is darkest.
- [ ] Sizes fit distance. Nothing farther looks bigger than the same kind of thing nearer.
- [ ] Clouds and high mist are in the sky only. Nothing floats. Everything has a contact shadow.

### Light

- [ ] One main light with a stated direction and height.
- [ ] Lit edges, shadow sides, cast shadows, reflection and glow all agree with it.
- [ ] Shadow length fits the light height.
- [ ] Lamps and headlights are on only when it is dark or foggy.
- [ ] If time passes, the sun, sky, shadows, lamps and stars all change together.
- [ ] The subject stands out from what is behind it.

### Camera

- [ ] Shot type, lens and height fit the purpose.
- [ ] Each camera move has a reason, eases in and out, and ends on a composed frame.
- [ ] No rotation, no direction reversal in a shot, no runs of zooms.
- [ ] Shots in one place are one continuous path. Screen direction is kept.
- [ ] Focus is on the subject. The subject and the named thing are never blurred.
- [ ] Motion blur is only on fast things, along their direction of travel.
- [ ] Subject on a third, horizon off the middle, space in front of movement, key things inside the margins.
- [ ] Every special shot (section 30) starts on its word, comes from the plan's `"shots"` when there are any, and joins back without a cut.

### Motion and comfort

- [ ] Feet do not slide. Wheels turn to match distance. Parked wheels are still.
- [ ] Faces change at least two parts plus the body, and hold long enough to read.
- [ ] No flicker, no moving fine pattern, steady horizon, one big change at a time.
- [ ] Background life does not pull the eye from the subject.

### Continuity

- [ ] The continuity ledger matches every shot: time, weather, clothes, props, doors, lights, positions.
- [ ] What changed stays changed: wet stays wet, a bandage stays on, dirt and rips stay, until the story changes them.
- [ ] `COND` in `PART({...})` matches the state sheet row; changes inside the part happen on their words.
- [ ] Faces follow a feelings arc (`feelAt`); nobody snaps from one feeling to another; everyone reacts to big events about 0.3 s late.
- [ ] Every shot has life: no frozen asset that would move in the real world.

### Technical

- [ ] One self-contained HTML file. No images, libraries or network.
- [ ] Everything is a function of the clock. `window.seek(t)` gives the same frame every time.
- [ ] Only the ground is true 3D. Standing layers use the projection maths.
- [ ] No layer wider than about 2000 px in layout. Layers cover the frame for the whole camera path.
- [ ] Ids are prefixed. Layer and blur budgets are respected.
- [ ] Captions, if any, are inside the margins, never cut off, never over a face.

### Delivery

- [ ] The output follows the format for its mode in section 12.
- [ ] No music or sound effects were added.
- [ ] My assumptions are listed at the end.

### Project (sections 14 to 21)

- [ ] `LINT()` passes on every line (Checks tab).
- [ ] Only one part block was added or changed. Engine, library, plan, player and other parts are untouched.
- [ ] Times, words and joins are copied from the project plan.
- [ ] Every person is drawn with `place()`, every shared thing with `A.name()`, every person shot is framed with `shot()`.
- [ ] No camera, blur, shake, caption or mood maths was written inside the part.
- [ ] The first picture differs from the `ends_on` of the part before.

### Sync (section 15)

- [ ] The reply starts with the sync line.
- [ ] `SEG` holds only the words of the asked part, in full-audio seconds.
- [ ] `AUDIO_START` is set once. No audio was cut or embedded.
- [ ] Words a second is between 2.2 and 3.6.

### Pacing, people and energy

- [ ] The first frame is the hook: the first thing the narration names, shown large.
- [ ] There is a new picture idea every 1 to 2 seconds, and no unchanged picture lasts over 2 seconds.
- [ ] The main person is at least a third of the frame height in every beat that is not a short Wide.
- [ ] No two beats in a row use the same framing size on the same subject.
- [ ] Beats are joined by whips of 0.25 to 0.35 seconds. There is no cut inside a place.
- [ ] Motion blur appears on every whip, on the background only while tracking, and nowhere else.
- [ ] Micro shake is on, with hits only on impacts and key words, and one biggest hit.
- [ ] The light mood changes at least once per 20 seconds, on a word, and matches the turn in the story.
- [ ] Every person comes from `person()` with `headR: 43`. No hand-drawn faces or limbs.
- [ ] Every person has a feeling and a pose by name, and the feeling was passed to `poseAt` so the body acts.
- [ ] Body states (cold, wet) are switched on at the right word and carried into later beats.
- [ ] Captions are one or two big words, key words in gold, never blurred or shaken.

## 14. The project file and the worked example

Everything lives in this one file. It is the rulebook, the plan, the engine, the assets, the parts and the player together. The user gives it to you, you add to it, and you give it back.

### What is in the file

| Block | What it holds | What you may do |
| --- | --- | --- |
| Rulebook (`id="rulebook"`) | This text | Read it. Never change it |
| Project plan (`id="project"`) | JSON: the audio map, every part with its audio times, words, place, time, moods, cast, assets and joins, and the continuity notes | Fill it in MODE: PROJECT. In other modes read it and obey it |
| PART A, character engine | `person`, `place`, `poseAt`, `easePose`, `faceAt`, `CAST`, `FACES`, `POSES`, `LOOKS`, `mix` | Never rewrite. Add people and looks in the cast block, in MODE: CAST |
| PART A1, front and back views | `personFV`, used by `place()` when `view` is `front` or `back` | Never rewrite. Never call it yourself: ask for the view through `X.who()` |
| PART A2, scene engine | `PART`, `STAGE`, the camera, motion blur, micro shake, `MOOD`, captions, joins, `shot`, `FX`, `handPos`, `ASSET` | Never rewrite. Never copy its maths into a part |
| Cast block (`script data-cast`) | New people and new looks: `CAST` entries, `HAIR()` and `OUTFIT()` | Add to it only in MODE: CAST (section 18) |
| Asset library (`script data-assets`) | Every shared asset as `ASSET(name, spec, draw)` | Add assets only in MODE: ASSETS |
| Parts (`script data-part="N"`) | One closed block per part | You write ONE of these per SCENE request |
| PART C, player and board | Playback with the full narration, the tabs Video, Parts, Cast, Assets, Checks, Ask, the join buttons, `seek`, `LINT` | Never change |

### What the engine does for you (so you never write it)

- **Camera.** You give keys `[time, x, y, zoom]`. The engine eases between them and blends zoom by ratio.
- **Motion blur.** Worked out from camera speed with the fixed numbers of section 8. Tracking shots keep the subject sharp.
- **Micro shake.** The always-on drift and your hits `[time, strength]`.
- **Light.** You give `[time, mood name, fade seconds]`. The engine blends sky, ground, colour wash, light on people and dark corners.
- **Captions.** Built from `SEG`. One or two words, gold for key words, same size and place in every part.
- **Joins.** The start and end of every part: `dip` (to and from dark), `whip` (slides out left under blur, next part slides in from the right) or a paper join, `page`, `fold`, `flats` or `ink` (section 33).
- **Framing.** `shot(size, person, x, groundY)` returns a camera key that frames a person the approved way, so a head is never cut off.

Because the engine owns these, every part from every model moves, blurs, shakes, lights and captions the same way. That is the point. If you write your own version of any of them, the part fails.

### The part contract

A part is one closed block. Copy the shape of part 1 in this file.

```js
(function(){
const P = PART({ id: 2, of: 5, title: 'Earlier that afternoon',
  AUDIO_START: 22.92, AUDIO_END: 40.58,            // copied from the project plan
  SEG: [[22.92, 24.96, 'Earlier that afternoon in Pennsylvania,'], ...],   // full-audio seconds
  KEY: /^(ice|snapped|minutes)/i });               // caption words shown in gold
const T = P.T, END = P.END;                        // END = AUDIO_END - AUDIO_START
const tSnap = T('snapped');                        // every beat time comes from a word

P.KEYS  = [[0, ...shot('WIDE', CAST.boy, 0, 0)], [2.1, ...shot('CLOSE', CAST.boy, 0, 0)], ..., [END, x, y, zoom]];
P.HITS  = [[tSnap, 10]];                           // [time, strength 3 to 11]
P.MOODS = [[0, 'day', 0], [tSnap - .2, 'heavy', .5]];   // [time, mood, fade seconds]
P.TRACK = [[t0, t1]];                              // optional: times when the camera tracks a moving subject
P.BIG   = { re: /snapped/i, from: 0 };             // optional: words that get the bigger caption
P.IN = 'dip'; P.OUT = 'whip';                      // copied from the project plan

P.draw = (t, X) => {                               // return the picture, far to near
  let o = X.lay(.05, A.lowSun({x:-140, y:-330}));                       // sky
  o += X.lay(.14, A.hills({c: mix(X.m.sky[2], '#1B2A4A', .45)}), 'mbBg');   // far
  o += X.lay(.5,  ..., 'mbBg');                                          // middle
  o += X.lay(1,   ground + assets + place(CAST.boy, x, 0, pose, face, X.who('normal')), 'mbAll');   // subject
  o += X.lay(1.7, darkForegroundShapes, 'mbFg');                         // foreground
  return o; };
P.over = (t, X) => FX.flash(t, tSnap);             // optional: this part's own light effects
})();
```

What `X` gives you inside `draw`:

| Name | Meaning |
| --- | --- |
| `X.lay(f, svg, blur)` | One depth layer. `f` = 0.05 sky, 0.14 far, 0.5 middle, 1 subject, 1.7 foreground. `blur` = `'mbBg'` for sky, far and middle, `'mbAll'` for the subject layer, `'mbFg'` for the foreground |
| `X.m` | The mood now: `X.m.sky[0..2]`, `X.m.gnd[0..1]`, `X.m.light`. Mix far colours from `X.m.sky[2]` so distance follows the light |
| `COND` in `PART({...})` | The state sheet row at the start of the part: `{boy:{wet:1, cold:1}, medic:{dirt:.4}}`. Read it as `P.COND` |
| `X.who(state, size, view, cond)` | The options for `place()`: the right light for the mood, the body state (`normal`, `cold`, `wet`), head size 43, the view (`side`, `front` or `back`; side if left out) and the conditions (`{dirt:.5, bandage:'head'}`, section 6) |
| `feelAt(t, keys)`, `feelName(t, keys)`, `react(t, t0)` | A feelings arc that blends, the feeling in charge for `poseAt`, and a late reaction to an event (section 6) |
| `LIFE.sway`, `bob`, `flicker`, `blink`, `drift`, `pulse`, `spin` | Small motions for living assets (section 9) |
| `ZOOM.dive`, `pull`, `xray`, `cutaway`, `lens`, `exploded`, `scale`, `bones` | Special shots: zoom into a thing, pull back out of a frame, x-ray and inside views, a torn-open cutaway, a magnifying lens, an exploded view and a size comparison (section 30) |
| `FRAME`, `MOVE`, `TIME`, `PLACE`, `SHOW`, `TURN` | Frames within the frame and seamless moves (section 31), time and place (section 32), explaining tools and paper transitions (section 33) |
| `X.screen(wx, wy, f)` | Where a world point of layer `f` is on the screen now, for screen tools placed on a person or a thing |
| `STAGE.W`, `STAGE.H`, `STAGE.cx`, `STAGE.cy` | The stage size and camera centre: 540, 960, 270, 610 on the vertical stage and 960, 540, 480, 352 on the wide stage. Use these, never the bare numbers, for anything full-screen |
| `X.full(svg, verticalBlur)` | A full-screen place with no camera layers (under water, inside a pipe). Set `X.sky = false`, and `X.grade = false` and `X.vig = .8` if it has its own dark light |
| `X.x, X.y, X.s, X.vx, X.vy, X.t` | Camera position, zoom, speed, and the clock |
| `url(#gnd)`, `url(#sky)`, `url(#deep)` | Ready gradients: ground, sky, deep water |

Rules of the contract:

1. One block, closed in `(function(){ ... })();`. Nothing leaks out. Two parts can use the same names inside without a clash.
2. `AUDIO_START`, `AUDIO_END`, `IN`, `OUT` and the words of `SEG` are copied from the project plan. You never choose them.
3. Use moods by name from `MOOD` (`night`, `heavy`, `day`, `lamp`, `dusk`, `overcast`). A new mood is allowed only as a full object with the same six fields, and only when no name fits.
4. Use assets from the library as `A.name({...})`. A thing that is drawn only in your part (a crack that grows, ripples) may be drawn inside the part. A thing other parts also need must be in the library first.
5. New poses inside a part are named with the part number in front: `POSES.p2_slip = {...}`. Never change a standard pose.
6. People are always drawn with `place()` and `X.who()`. Never draw a body part yourself.
7. Everything depends only on `t`. No random numbers, no timers, no state kept between frames.

### Framing with `shot()`

```js
[time, ...shot('CLOSE', CAST.boy, boyX, groundY)]                // head and chest
[time, ...shot('MEDIUM', CAST.medic, x, 0, {drop: 80})]          // kneeling: the head is lower
[time, ...shot('FULL', CAST.boy, x, 0, {ox: -60})]               // subject 60 px left of centre, room to run into
[time, ...shot('DETAIL', null, thingX, thingY, {w: 70})]         // a thing 70 units wide fills two thirds of the width
```

Sizes: `WIDE`, `FULL`, `MEDIUM`, `CLOSE`, `FACE`, `DETAIL`. They match the table in section 8. Use `shot()` for every key that shows a person. Write a key by hand only for a move between two shots or for a place with no person. For a moving person, call `shot()` with the person's position at that time.

### The worked example, beat by beat

This is the approved opening. Camera values are `x, y, zoom`. The rescue spot is at world x = 0, the hole in the ice at x = 1400, the doctor at x = -150.
