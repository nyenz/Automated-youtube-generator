### How to write a part, step by step

1. Read the project plan for your part: audio times, words, place, time, moods, cast, assets, joins, and how the part before ends.
2. Write the sync line (section 15). Fill `SEG` from the audio map, at the best timing level you have (section 22).
3. Write the beat plan (section 11): one line per beat with time word, what is seen, size, move, mood, effects.
4. Write `KEYS` with `shot()`, then `HITS`, `MOODS`, `IN`, `OUT`.
5. Write `draw`: layers far to near, library assets, people with `place()`, staged by section 24. Numbers and ideas follow section 25.
6. Open the file in a browser. Look at `seek(t, id)` in the middle of every beat and every whip.
7. Run `LINT()` in the console (or open the Checks tab). Fix every FAIL.
8. Run the self-check of section 13.
9. Return the whole file with only your part block added, in the reply shape of section 27.

### Recording to a video file

Open the page in a headless browser at 540 x 960 (or a multiple). For one part call `seek(i / 30, id)` for `i` from 0 to `END x 30`. For the joined video call `seek(i / 30)` over the whole length; `TIMELINE()` lists the parts and where each starts. Join the frames with the narration at 30 frames a second, starting the audio at the `AUDIO_START` of the first part. Because every frame depends only on `t`, the result is identical every time.

## 15. Audio, parts and sync (read this before every SCENE)

A long video is built in **parts**. Each request asks for ONE part. The picture, the captions and the voice of that part must be the same words. This section makes that certain. If any rule elsewhere disagrees with this section, this section wins.

### The five sync rules

1. **Build only the part that is asked for.** The request marks one piece of script as `SCRIPT FOR THIS PART`. Build that text and nothing else. Any other script text in the chat (the full script, earlier parts) is context only. It tells you the story, the cast and the light so far. Never draw it, caption it or time it.
2. **Never cut, trim, re-encode or embed the audio.** You do not make an audio clip. The player plays the user's full narration file and starts each part at its `AUDIO_START`. Cutting clips is where mistakes happen, so it is not allowed.
3. **Write every time in full-audio seconds.** The numbers in `SEG` are the times you hear in the full narration file, exactly as measured. Do not shift them yourself.
4. **One number does the shift: `AUDIO_START`.** It is the second in the full narration where this part begins. The kit subtracts it once, for the captions, the beats and the audio together. Clock `t = audio time - AUDIO_START`. Never subtract it anywhere else. Never write a second offset.
5. **Prove the sync before you draw.** Your first line of every SCENE reply is the sync line (below). If you cannot fill it in, stop and ask for the missing thing.

### How to find where a part sits in the audio

Use the first of these that you have:

1. **The project plan gives the times** (`start` and `end` of the part), or the request gives them. Use them.
2. **The request or this file gives an AUDIO MAP** (a list of the speech pieces between pauses). Match the words of the part to the pieces in order. The part begins at the start of its first piece and ends at the end of its last piece.
3. **You only have the audio file.** Find the pauses yourself (section 11, "Timing words"), then do step 2.

To find the first piece of a later part: count the words of the script before the part and the words in the whole script. The part starts near `total length x words before / words in all`. Then move to the nearest long pause (0.45 s or more). Parts begin after long pauses.

### The number check (do it every time)

- Count the words in the part. Divide by the length of your audio slice. A normal voice speaks **2.2 to 3.6 words a second**. If your number is outside this, the slice is wrong. Find it again.
- Every piece in `SEG` must also be between 1.5 and 4.5 words a second. A piece outside this is matched to the wrong words.
- `AUDIO_START` of this part must be the same as, or a little after, the end of the part before it. Parts never overlap and never leave a gap longer than 1 second.
- The first `SEG` time minus `AUDIO_START` must be between 0 and 0.6 s. If it is 20 s, you have shifted twice or not at all.

### The sync line

Start every SCENE reply with this one line, with real values:

```
SYNC  part 2 of 5 | audio 22.92 to 39.87 s | first words "Earlier that afternoon" | last words "twenty minutes" | 47 words | 2.8 words a second | AUDIO_START = 22.92
```

The player prints the same facts under the video, taken from `SEG` and `AUDIO_START`. The user reads that line, presses Audio, picks the narration file and presses Play. If the voice and the captions do not say the same words, the part is wrong.

### What you set in your part

```js
const P = PART({ id: 2, of: 5,
  AUDIO_START: 22.92,        // second in the full narration where this part begins (from the project plan)
  AUDIO_END:   40.58,        // where the next part begins (from the project plan)
  SEG: [[22.92, 24.96, 'Earlier that afternoon in Pennsylvania,'], ...],   // full-audio seconds
  KEY: /^(ice|snapped)/i });
```

Everything else follows by itself: `P.END = AUDIO_END - AUDIO_START`, `P.T('word')` returns clock time, captions use clock time, the scrub bar ends at `END`, and the player plays the narration from `AUDIO_START`. The Checks tab and `LINT()` test all of this.

### Carrying the story across parts

- Read the earlier script as context. Keep the same cast, clothes, place and props.
- Start the part in the light and time of day where the story now is. If the part jumps in time ("Earlier that afternoon"), change the light and say so in your assumptions.
- Do not repeat the opening shot of an earlier part.

### Recording a part

Step the frames with `seek(i / 30)` for `i` from 0 to `END x 30`. Join them with the audio taken from the full file at the same place: `ffmpeg -framerate 30 -i f%05d.png -ss AUDIO_START -t END -i narration.wav -c:v libx264 -pix_fmt yuv420p -c:a aac part2.mp4`. The same `AUDIO_START` and `END` are used here, so the file cannot drift.

### How the user should ask (one part at a time)

```
MODE: SCENE
PART: 2
Build only part 2 of the project plan in this file.
```

The plan in the file holds the words and the times, so the request does not need them. The Ask tab of the file gives the exact request for every stage.

## 16. Projects: plan once, build in separate chats, join into one video

One model or many models can build a video, in one chat or in many chats that never talk to each other. This works because all of them read the same project file and obey the same plan. The file is the only thing that passes between chats.

### The stages

| Stage | Mode | Who | What comes back | The user checks it in |
| --- | --- | --- | --- | --- |
| 1 | PROJECT | One chat, once | The file with the project plan filled in for the whole script | Parts tab |
| 2 | ASSETS | One chat (may be the same) | The file with every planned asset added to the library | Assets tab |
| 3 | CAST | One chat | The file with every planned person added | Cast tab |
| 4 | SCENE | Any chat, any model, in any order, one part each | The file with that one part block added | Video and Checks tabs |
| 5 | IMPROVE | Any chat | The file with that part or asset improved | Video tab |
| 6 | Join | No model. The user presses two buttons | One file with all parts | Video tab, All |

Stages 1 to 3 must be finished and approved before stage 4 starts. Every chat in stage 4 gets the **same** file from the end of stage 3. That is what makes separate chats agree.

If a request skips a stage (SCENE asked, but the plan has no entry for that part, or a planned asset is missing), do not guess. Say which stage is missing and stop. The one exception: if the user says "do everything", run the stages in order in one reply.

### MODE: PROJECT, step by step

You get the full script and the narration (or its audio map). You return the file with the JSON plan filled in. You draw nothing.

1. **Stage.** Set `"stage"` to `vertical` or `wide` as the user asks (vertical if they do not say).
2. **Audio map.** If the user gave Whisper word times, store them as `audio.words` (section 22). If `audio.map` is empty, find the pauses (section 11) and fill it: one `[start, end]` pair for each piece of speech.
3. **Split into parts.** A part is one run of story in one stretch of time. Aim for 12 to 25 seconds. Never longer than 30. Cut only at a long pause (0.45 s or more), at the end of a sentence. A change of place or a jump in time is a good cut.
4. **Give each part its audio times.** `start` of part 1 is 0. `start` of every other part is the END of the long pause before its first word. `end` of a part equals `start` of the next. The last part ends at the audio length. Parts touch. No gaps, no overlap.
5. **Do the number check** of section 15 on every part.
6. **Write the fields** of every part (below).
7. **Decide every join.** Same place and time flowing on: `whip`. A jump in time or place: `dip`. A chapter change or a jump into an explainer picture: a paper join, `page`, `fold`, `flats` or `ink` (section 33). The `out` of a part must be the same word as the `in` of the next. The first part has `in: dip`. The last part has `out: none`.
8. **Give each part its job** in the story shape of section 23, and mark the parts that need an explainer picture (section 25).
9. **List the cast and the assets** each part needs, by name. Use names already in `CAST` and the library when they fit. Give a new name only for a new thing. The same thing has the same name in every part.
10. **Write the continuity notes**: what each person wears and carries, which way each person moves on screen, the weather, the place, and anything that must stay the same.
11. **Write the state sheet** (section 10): `state` for every person (start and every change with part, word and reason), `arcs` (feelings part by part), `world` and `effects`.
11. Remove the `todo` note when every part is planned.

Fields of one part in the plan:

```json
{"id": 2, "title": "Earlier that afternoon", "start": 22.92, "end": 40.58,
 "text": "the exact words of this part",
 "place": "where", "time": "time of day, and how it changes",
 "moods": ["day", "dusk", "heavy", "night"],
 "cast": ["boy", "medic"], "assets": ["pine", "hills", "sled", "iceHole"],
 "in": "dip", "out": "whip",
 "starts_on": "what the first second shows, and its size",
 "ends_on": "what the last second shows, its size and its light",
 "job": "climb: how it happened",
 "beats": ["3 to 8 short lines: the main things seen, in order"]}
```

`starts_on` and `ends_on` are promises between chats. The model that builds part 3 reads the `ends_on` of part 2 and starts from a different size and a different picture, in the same light if the join is a whip.

### MODE: ASSETS and MODE: CAST

Follow sections 17 and 18. Make everything on the plan's lists that is missing: assets in the asset library, people and their looks in the cast block. Change nothing that exists. Tell the user to open the Assets or Cast tab and approve.

### MODE: SCENE inside a project

1. Read the plan entry for your part and the entry before and after it.
2. Copy `AUDIO_START`, `AUDIO_END`, `IN`, `OUT` and the words from the plan. Never change them. If you think the plan is wrong, build to the plan anyway and say what you think is wrong in your assumptions.
3. Use only people and assets that are in the file. If the part truly needs a thing that is missing, draw it inside your part, name it in your reply under NEW THINGS, and keep it simple.
4. Obey the continuity notes: clothes, props, weather, place, time of day.
5. Build the part (section 14). Run `LINT()`. Every line must pass.
6. Return the whole file with ONE new `script data-part="N"` block. The rulebook, the plan, the engine, the library, the other parts and the player are byte for byte the same.

Never build a part that the request did not name, even if you have time.

### Joining

The user opens any one of the returned files, goes to the Parts tab, presses **Add parts from files**, picks the other returned files, and presses **Save joined file**. The page copies each part block into one file. The All tab then plays every built part in order, with the narration.

Parts join as one video because:

- every part uses the same engine, people, assets, moods, captions and shake,
- the audio times touch, so the voice never jumps,
- both sides of a join use the same join type, and the engine draws it the same way,
- each part starts on a different picture from the one the last part ended on.

If asked for MODE: JOIN, do the same by hand: copy the part blocks into one file, change nothing inside them, run `LINT()`.

### What to do when a joined video does not flow

| Problem | Fix (MODE: IMPROVE on one part) |
| --- | --- |
| The light jumps at a whip join | Make the first mood of the later part the same as the last mood of the earlier part |
| A person changes clothes or size | A part did not use `CAST` or the continuity notes. Fix that part |
| Two parts open the same way | Change the first shot size of the later part |
| A thing looks different in two parts | It was drawn inside both parts. Move one drawing into the library and call it from both |
| The voice and captions slip | A part does not match the plan times. `LINT()` names it |

## 17. Assets: how to make one and how to improve one

Section 5 says what an asset must look like. This section is the procedure.

### Making a new asset (MODE: ASSETS or ASSET)

1. **Ticket.** Write one line: name, what it is, the depth band it lives on, its real size in units (in the project engine a standing adult is about 340 units tall), where its anchor is, and what may change (colour, a number on a screen, open or shut).
2. **Reference check.** Name the three things that make this object readable as a silhouette (a sled: flat deck, curled runner, rope). Those three must be clear at thumbnail size.
3. **Build order.** Big silhouette first. Then 2 to 4 inner shapes. Then one gold line or trim. Then one light accent. Stop. Stay inside the shape budget of section 5 for its band.
4. **Colours.** Only palette colours and mixes of them made with `mix()`. Anything on the far or middle band takes its colour as a `c` option, so the part can mix it with the sky.
5. **Anchor.** The base centre sits at (0,0) so `x` puts it on the ground. Sky things and hand props are anchored at their centre or grip, and the note says so.
6. **Register it.**

```js
ASSET('sled', { band: 'subject', note: 'small red sled with a curled runner', box: [-70, -40, 150, 50], demo: { x: 0 } },
  ({ x = 0 }) => `<g transform="translate(${x} 0)"> ... </g>`);
```

`box` is `[x, y, width, height]` around the drawing, for the asset sheet. `demo` is the options the sheet draws. Add `dark: 1` if it is pale and needs a dark card.

**Every asset is alive or says why not.** Add `alive: 'sway'` (or `drift`, `blink`, `glow`, `ripple`, `pulse`, `spin`) and move the part that would move in the real world, with the clock from `LIFE.t(o)` and the helpers of section 9: leaves sway, a screen glows, a light blinks, water ripples, a flag waves. Only a thing that is truly still takes `still: 'lies flat on the ground'` instead. Keep the motion small and slow; it must not pull the eye from the subject.
7. **Sheet check.** Open the Assets tab. The asset must read at card size, sit inside its card, and look like it belongs beside the others: same line weight, same corner softness, same amount of detail.
8. **Scale check.** Stand it next to a person in a test frame. A door is taller than a person. A sled reaches the knee.

Assets take options, never a state of their own. An asset that moves (a wheel turning, a light blinking) reads its clock with `LIFE.t(o)`, so a part may pass `t` but does not have to.

### Improving an asset (MODE: IMPROVE on an asset, or DETAIL)

Score it 0, 1 or 2 on each line. Fix the lowest first. Stop when every line is 2 or the budget is used.

| Check | 2 means |
| --- | --- |
| Silhouette | Fill it black and it is still named correctly |
| Proportion | Real-world proportions, right size beside a person |
| Shape language | Soft corners, long clean curves, flat fills, like the rest of the library |
| Light | One lit side and one shade side that agree with light from the left |
| Material | One accent says what it is made of (a shine on metal, a seam on cloth) |
| Detail budget | Inside the shape count for its band |
| Family | Beside the other assets it looks drawn by the same hand |

Rules for improving:

- Keep the name, the anchor, the size and the options. Parts already call it. An improvement must not move it or change how it is called.
- Add options with defaults. Never remove one.
- Show before and after in your reply by saying what changed, line by line.
- If the change is so big that old parts would look wrong, make a new asset with a new name instead.

## 18. People: how to add one and how to improve one

Section 6 says how people are built. This section is the procedure. People are the most important thing to keep the same, so the rules are strict.

### Adding a person (MODE: CAST)

1. **Read the plan.** Age, job, role in the story, and the continuity note for clothes.
2. **Pick the numbers.** One `CAST` entry, written in the cast block:

```js
CAST.diver = { name: 'Diver', scale: 1, headK: 1, skin: '#E5BE98', hair: '#2A1C14', coat: P.night, coatLen: 8, legs: P.night, boots: P.night, hat: 'cap', kind: 'medic' };
```

| Who | `scale` | `headK` |
| --- | --- | --- |
| Child 5 to 9 | 0.66 to 0.74 | 1.12 |
| Child 10 to 13 | 0.78 to 0.86 | 1.06 |
| Teen | 0.9 to 0.95 | 1.02 |
| Adult | 0.95 to 1.02 | 1 |
| Old person | 0.92 to 0.97 | 1, with grey hair and a slight forward `torso` in poses |

3. **Tell people apart by three things**: coat colour, hat or hair shape, and height. Two people in one shot must differ in at least two of them. At most one person wears strong red.
4. **Clothes come from the palette.** Skin and hair can be any natural tone; use the tones already in `CAST` or mix new ones. If no existing hair, hat or outfit fits, make a new look (below).
5. **Check the Cast tab.** The new person stands beside the others. Same line, same head, same hands.
6. **Check three feelings and two poses** on the new person before a part uses them: neutral, the main feeling in the story, shouting or crying; stand and walk.

Never draw a person any other way. Never change `person()`. Never change the head size (43) or the body constants. New hair, hats and outfits go in the LOOKS library (below), not in the engine. If the plan needs something the engine cannot do (a view from above, a baby, an animal), say so under LIMITS and use the closest thing that works (a side view, a bundle in a blanket, a simple asset).

### New looks: hair, hats and outfits

The engine draws four hair or hat styles (`bun`, `grey`, `beanie`, `cap`) and four outfits (`medic`, `boy`, `mother`, `doctor`). Any other look (long hair, a helmet, a hijab, a suit, a nurse's uniform) is added to the **LOOKS library** in the cast block, without touching the engine. A person then uses it by name: `hat: 'long'`, `kind: 'suit'`.

Two ways to make a new person, easiest first:

1. **Recolour.** Use an existing look with new colours: `skin`, `hair`, `coat`, `legs`, `boots`, `mitt`, `coatLen`, `lips`, `lash`, `glasses: true`. No drawing needed.
2. **New look.** Add a `HAIR()` or `OUTFIT()` entry, then a `CAST` entry that names it.

```js
HAIR('long', {
  side:  { behind: g => ..., over: g => ..., top: g => ... },   // each returns SVG; leave out the layers you do not need
  front: { behind: g => ..., over: g => ... },
  back:  { over: g => ... }
});
OUTFIT('suit', { side: g => ..., front: g => ..., back: g => ... });
CAST.teacher = { name: 'Teacher', scale: .96, headK: 1, skin: '#B9835C', hair: '#1E1410', coat: P.indigo, coatLen: 24,
                 legs: P.deep, boots: P.bark, hat: 'long', kind: 'suit', trim: P.gold, glasses: true };
```

The three hair layers, in drawing order:

| Layer | Drawn | Use it for |
| --- | --- | --- |
| `behind` | Before the ear and the face | Hair that hangs behind the head: long hair, a bun at the back, a hood behind the neck |
| `over` | After the face shape, before the eyes and mouth | The top of the hair, a fringe, a cap, a helmet, a headscarf |
| `top` | After the eyes and mouth | Things in front of the face: a visor, a mask, a beard |

What a look gets in `g`:

| Name | Meaning |
| --- | --- |
| `g.k(v)` | Head units to pixels. The head is a circle of radius 1 around (0, 0). In side view the face points to +x. Top of the head is y = -1, chin is y = 1 |
| `g.draw(shape, colour, g.a, soft)` | Paints a shape with the engine's light bands and rim, so it is lit like the rest. `shape` is `f => '<path ... fill="' + f + '"/>'`. Use `soft` (true) for hair and skin |
| `g.hair`, `g.skin` | This person's hair and skin colours, already changed for night, cold and wet |
| `g.cloth(c)`, `g.adj(c)` | Turn a palette colour into this person's lit cloth colour, or into a night-adjusted colour |
| `g.ch` | The `CAST` entry. Read your own extra fields from it, like `g.ch.hatCol` or `g.ch.trim` |
| `g.view`, `g.t`, `g.light` | The view, the clock and the light |
| Outfit only: `g.c`, `g.cl`, `g.sd` | Coat colour, coat length, and the darker seam colour. The torso runs from y -113 (shoulders) to `g.cl` (hem). Side view x is about -34 to 40, front and back x about -37 to 37 |

Rules for new looks:

1. **Every look has a side, a front and a back drawing.** The Checks tab fails a look that is missing one.
2. **Stay in the style.** Flat shapes, soft corners, palette colours (section 2), one gold line or trim, `g.draw` for the big shapes so they get the light. Copy the nearest built-in look in the engine and change it.
3. **Stay inside the outline.** Hair may reach the shoulders (y up to 1.4 in head units). An outfit stays inside the coat. Never draw arms, hands, legs or a face in a look.
4. **Leave the face clear.** Nothing in `over` may cover the eyes (y -0.25 to 0.2, x 0 to 0.8 in side view, x -0.55 to 0.55 in front view). Front hair that hangs down is drawn in `behind` and stays at the sides.
5. **Extra options have defaults.** A look that reads `g.ch.hatCol` must work when it is missing: `g.ch.hatCol || P.red`.
6. **Name it for what it is**: `long`, `helmet`, `hijab`, `suit`, `nurse`. Never a person's name. One look can serve many people.
7. **Check it.** Open the Cast tab: every person shows side, front and back. Then test three feelings (neutral, the main one, shouting) and two poses (stand, walk) in each view, in day and night light.
8. **Improving a look** follows "Improving a person or a look" below. A big change to a look that built parts already use gets a new name.

The file holds two example looks of each kind, made this way: `long` hair and a firefighter `helmet`; a `firefighter` coat and a `suit`. Two example people use them: `firefighter` and `teacher`. They are examples to copy. They are not yet approved.

### Views: side, front, back

Every person can be drawn from three sides. Ask for the view in `X.who(state, size, view)`:

```js
place(CAST.doctor, x, 0, poseAt('stand', t), faceAt('shouting', t), X.who('normal', 1, 'front'))
```

| View | Use it for |
| --- | --- |
| `side` (the default) | Action: walking, running, carrying, reaching, pointing at something, two people facing each other |
| `front` | A person speaking to the viewer, a reaction where both eyes carry the feeling, a group standing together, walking toward the camera |
| `back` | A person looking at something far away (we look with them), walking away, standing between us and the subject |

Rules for views:

- The pose names and feeling names are the same in every view. The same joint angles are used, seen from that side.
- In front and back view a small swing forward or back shows as a shorter limb. An arm lifted more than about 55 degrees is shown raised out to the side. So a person who points at a thing, reaches for it or pulls it is drawn from the side.
- Bodies that are turned over (`lying`, `fall`, `float`) are always drawn from the side, whatever view is asked.
- `flip` only matters in side view.
- Never change a person's view while they are sharp on screen. Change it inside a whip, behind a foreground shape, or on a join.
- Walking toward the camera: `front` + `walk`, and let `size` grow a little over time. Walking away: `back` + `walk`, and let `size` shrink.
- At most one person in a shot looks straight out at the viewer. It is a strong picture. Keep it for the line that matters.
- Side view is the approved default. Front and back views are new in version 5.

### Adding a pose or a feeling

- A pose is a set of joint angles (section 6). Start from the nearest standard pose, copy it, change at most four numbers, and look at it. Name it `pN_name` inside a part. A pose that many parts need is added to `POSES` in MODE: CAST with a plain name.
- A feeling is a `FACES` entry. Copy the nearest one and change brows, eye, mouth and the `body` hints. A feeling always moves the body too, never the face alone.
- Move between poses with `easePose` over 0.15 to 0.4 seconds. A pose never snaps unless it is a hit.

### Improving a person or a look (MODE: IMPROVE)

Use this when the user says a person, a hair style, a hat or an outfit looks wrong or plain ("the helmet is too flat", "make the teacher look older", "the suit needs more detail"). It works the same for the built-in people and for new ones.

1. **Open the Cast tab** (or the people page) and look at the person from side, front and back, in day and night light.
2. **Score each line 0, 1 or 2.** Fix the lowest first.

| Check | 2 means |
| --- | --- |
| Reads at a glance | Fill the person black and you can still tell who it is (helmet, long hair, coat length) |
| Fits the story | Age, job and mood match the plan and the continuity notes |
| Same in all three views | Colours, trims and shapes agree in side, front and back |
| Lit like the rest | Big shapes use `g.draw`, so they have the light bands and rim |
| Style | Flat shapes, soft corners, palette colours, one gold line, no tiny busy detail |
| Face clear | Nothing covers the eyes or mouth in any view or feeling |
| Stands out from the others | Differs from every other person in at least two of: coat colour, hair or hat shape, height |

3. **Choose what to change**, smallest first:
   - colours and sizes in the `CAST` entry (no drawing),
   - the shapes inside the `HAIR()` or `OUTFIT()` entry,
   - a new look with a new name, when the change is big.
4. **Check** three feelings and two poses in every view, then run `LINT()`.
5. **Report** the scores before and after, and what changed, line by line.

When you may change a look in place, and when you must make a new one:

| Situation | What to do |
| --- | --- |
| No built part uses this person or look yet | Change it in place |
| Built parts use it, and the change keeps the same outline, colours and size (cleaner shapes, better light, a small trim) | Change it in place. Say which parts will look slightly different, so the user can check them |
| Built parts use it, and the change is big (new shape, new colour, new length) | Make a new look with a new name (`helmet2`) and a new person or a new `hat` value. Old parts keep the old look until the user asks to switch them |
| The user approved the person | Change it only when the user asks |

Never change the engine to improve a look. If a look truly cannot be made with the three layers and `g.draw`, say so under LIMITS.

### Improving people in a scene (MODE: IMPROVE)

Check these in order and fix what fails:

1. **Is it the right feeling for the words?** The face and the body both show it.
2. **Does the body act?** Weight leans the way the person moves. Hands do something (hold, point, reach, clench).
3. **Do the feet stand on the ground?** `groundY` is the ground line of the subject layer. No floating, no sinking.
4. **Do hands meet things?** Put a prop at `handPos(...)`. A carried person sits in the carrier's arms, not beside them.
5. **Is there small life?** Blink, breath, a sway. Nobody is frozen unless the story says so.
6. **Does the state carry?** Wet stays wet, cold stays cold, a lost hat stays lost, a bandage stays on, dirt and rips stay, across parts too. Use the conditions of section 6 from the state sheet.
6b. **Does the face follow the story?** A feelings arc that blends, pain where there is pain, reactions to big moments about 0.3 s late, eyes on what matters.
7. **Is the framing kind to the face?** Use `shot()`. The head is whole. The eyes are in the top half of the frame.

## 19. Improving a scene (MODE: IMPROVE)

Use this when the user says a part is flat, slow, unclear, or just "make it better". It is a fixed procedure, so any model improves the same things in the same order.

### The passes, in order

Do every pass. In each pass, look at frames with `seek(t, id)`, write what is wrong, then fix it. Do not jump ahead: a later pass is wasted if an earlier one fails.

| Pass | Question | Typical fix |
| --- | --- | --- |
| 1. Sync | Do `LINT()` and the sync line pass? | Fix `SEG` or the plan times |
| 2. Story | For every phrase, does the picture show that exact thing at that exact time? | Move a beat to its word with `T()`. Add the missing picture |
| 3. Framing | Is the subject large and whole? Any head cut off? Any third of the frame empty? Same size twice in a row? | Use `shot()`. Change the size. Add a foreground shape |
| 4. Pacing | Does a new picture or move come every 1.5 to 2.5 s? Does the camera ever rest too long? | Add a key. Split a long hold into a push and a whip |
| 5. Flow | Is it one continuous path, with whips between subjects and no dead stop? | Join two holds with a whip of 0.25 to 0.35 s |
| 6. Light | Does the mood change on the turns of the story? Is the darkest moment the darkest frame? | Add a `MOODS` step on the word. Add `FX.flash` on the peak |
| 7. People | Run the list in section 18 | Change feeling, pose, hands, state |
| 8. Set | Are there five depth layers with something in each? Does every object belong to this place and time? | Add far and foreground shapes from the library. Remove what does not belong |
| 9. Energy | Are there hits on the key words, with one clear biggest hit? | Add or re-rank `HITS`. One hit of 9 to 11, the rest 3 to 6 |
| 10. Comfort | Any dense moving pattern, flicker, or spin? | Remove it (section 9) |
| 11. Checks | `LINT()` all pass, section 13 all pass | Fix |

### Scoring

Before and after, score each pass 0 (fails), 1 (works) or 2 (strong). Report both rows. An improvement that does not raise a score is not an improvement: undo it.

### Limits of an improvement

- Change only the part or asset that was named.
- Never change `AUDIO_START`, `AUDIO_END`, the words, or the joins.
- Never change the engine, the library or another part. If the fix belongs there, say so and stop.
- At most three new things on screen per pass. More detail is not better. Clearer is better.
- Keep what the user said they liked.

### The reply

```text
MODE: IMPROVE   PART: 2
SCORES BEFORE: sync 2 | story 1 | framing 0 | pacing 1 | flow 1 | light 1 | people 1 | set 1 | energy 0 | comfort 2
WHAT WAS WRONG: <one line per finding, with the time>
CHANGES: <one line per change: what, when, why>
SCORES AFTER:  ...
CODE: <the whole file, only that part block changed>
LEFT FOR LATER: <things outside this part>
```

## 20. Long videos

A long video (2 minutes or more) is built exactly like a short one, as a project of parts. Only the planning grows.

### Structure

- **Chapters.** Split the script into chapters of 40 to 90 seconds, one idea each. Give each a one-line purpose.
- **Parts.** Split each chapter into parts of 12 to 25 seconds (section 16). Number the parts straight through the whole video.
- **Places.** List every place in the story once. A place that is used by more than one part is built once as library assets (its ground, its buildings, its far ridge) and reused. Aim for few places used well: at most one new place per 30 seconds.
- **Cast.** List every person once, with clothes. Nobody changes clothes unless the story says so.

Add to the plan:

```json
"chapters": [{"id": 1, "title": "The cold", "purpose": "the viewer fears the boy is dead", "parts": [1, 2]}],
"places": [{"name": "pond", "assets": ["hills", "pine", "iceHole"], "used_in": [1, 2, 5]}]
```

### Pacing over a long run

- A short keeps one speed. A long video breathes: every chapter has a fast stretch, one slow moment of 3 to 4 seconds, and a peak.
- Open the whole video with its strongest picture inside the first 2 seconds.
- Every 20 to 30 seconds give the eye something new: a new place, a new person, a new kind of shot, or a diagram.
- Bring one picture back (the thermometer, the hole in the ice) at the start, the middle and the end. It ties the video together.
- Never use the same opening shot for two parts in the same chapter.

### Order of work

1. PROJECT for the whole script. The user approves the Parts tab.
2. ASSETS and CAST for the whole video. The user approves both tabs. This is the moment to fix the look. After this, nothing in the library changes.
3. Build part 1 and stop. The user approves the look and the pace.
4. Build the rest, in any order, in any number of chats. Each chat gets the approved file.
5. Join. Watch the All tab once from start to end. Fix joins with IMPROVE.

### Keeping the file small

Parts are text, so even 30 parts is a small file. Never embed audio or images. If one reply cannot hold the whole file, return only the new `script data-part="N"` block and say so; the user's join button reads it from any file that contains it.

## 22. Exact word timing

Captions and beats are only as good as the word times. There are three levels. Use the best one you can, and say which one you used.

| Level | You have | Accuracy | What to do |
| --- | --- | --- | --- |
| A | A time for every word (from a caption or transcript tool, an SRT or VTT file, or a list the user typed) | Exact | One `SEG` piece per word or per short phrase |
| B | Only the audio and the script | About 0.1 to 0.2 s off inside long phrases | Pieces from pauses (section 11), words shared out by weight |
| C | Only the script and the total length | Rough | Share the time over all words by weight. Say clearly that it is a guess |

### Level A: turning word times into `SEG`

- A `SEG` piece is `[start, end, 'words']` in full-audio seconds. A piece may hold one word.
- Group words into pieces of 1 to 4 words. Start a new piece at every pause of 0.12 s or more, at every comma and full stop, and at every word that a beat hangs on.
- If the times come from an SRT or VTT file, a time like `00:00:22,920` is 22.92 seconds. Each caption line becomes one piece. If a line is longer than 5 words, keep it as one piece and let the weights share it.
- Never round a time by more than 0.01 s.

### Whisper: exact word times from the user's audio

The user can make word times with Whisper on their own computer:

```
whisper narration.wav --model small --word_timestamps True --output_format json
```

The JSON file has `segments`, and each segment has `words`, each with `word`, `start` and `end` in seconds of the full narration. When the user gives you this file:

1. **Flatten it.** Make one list of all words in order: `[start, end, word]`.
2. **Walk the script and the Whisper list together.** The script gives the spelling. Whisper gives the times. Whisper often mishears a name or a number; never copy its spelling.
3. **When the two do not line up word for word** (Whisper writes "8-year-old" and the script says "eight-year-old", or a number is split into several words), give the script word the start of the first matching Whisper word and the end of the last one.
4. **When one side has an extra word**, do not drop its time. Stretch the word before it to cover the gap.
5. **Build `SEG`** by the Level A rules: pieces of 1 to 4 words, a new piece at every pause of 0.12 s or more and at every word a beat hangs on. A piece starts at its first word's start and ends at its last word's end.
6. **Store it once.** In MODE: PROJECT put the whole list in the plan as `audio.words`, so every chat uses the same times. Each part then takes the words between its `start` and `end`.
7. **Check.** Run the number check of section 15. The first word of a part must start 0 to 0.6 s after the part's `start`.

Say `TIMING: Level A, Whisper` in your reply.

### Level B: making pause timing better

- Use the audio map in the project plan. Do not measure again with other settings, or two chats will disagree.
- Put the words that carry a beat at the **start** of a piece when you can. The start of a piece is exact. The middle is an estimate.
- If a piece is longer than 4 seconds, look for a shorter pause inside it (0.08 s) and split it there.

### Numbers, names and odd words

- Write `SEG` text the way it should appear in captions. The engine shows these words.
- A number is one caption word: write `120`, not "one hundred and twenty". Give it its own piece with the time of the spoken words, because the weights cannot guess how long digits take to say.
- A word you look up with `T('word')` must be spelled in `SEG` exactly as in the call, in lower case, without the comma. For a number use the next plain word, or make the number the first word of a piece and read the piece's start time.
- If the same word comes twice, `T('ice', 1)` gives the second one.

### When the user says the timing is off

The user will say something like "the caption is late at 14 s". Then:

1. Find the piece that holds that time.
2. Move only that piece's start or end, by the amount the user says (or 0.15 s if they give no amount).
3. Keep pieces in order and not overlapping.
4. Change nothing else. Beats follow by themselves, because they come from `T()`.

Never fix timing by moving camera keys or captions by hand. Fix `SEG`.

## 23. Story shape for a short

A short that looks good but has no shape still loses the viewer. Plan this shape in MODE: PROJECT, before any picture.

| Step | When | What it must do | In the worked example |
| --- | --- | --- | --- |
| Hook | 0 to 2 s | One strong, strange picture and a fact that begs a question. No greeting, no title | A thermometer reads 7 degrees on a child |
| Stakes | by 8 s | Who is in danger and why it matters | Cold, limp, no pulse |
| Open question | by 25 s | A line that the viewer cannot explain yet | "Do not warm him up" |
| Climb | middle | Each part answers a little and raises the next question. Each part has its own small peak | How he fell, why cold can protect |
| Turn | about two thirds in | The idea that changes how the viewer sees the start | The cold is what saved him |
| Payoff | last part | Answer the open question fully. Show the result | He lives |
| Last frame | last 1.5 s | One calm, clear picture that echoes the first. Hold it | The same thermometer, a healthy number |

Rules:

- One idea per part. If a part has two ideas, split it.
- Every part ends on something unresolved, except the last.
- The first picture and the last picture are related (the same object, changed). This also lets the video loop.
- The biggest shake hit and the biggest caption of the whole video happen once, at the open question or the turn.
- Slow down exactly once, for 3 to 4 seconds, just before the turn.
- When the script explains a science idea, the picture changes from the story world to an explainer picture (section 25), then returns to the story world for the payoff.

Write the shape into the plan as one line per part: `"job": "hook and open question"`, `"job": "climb: how it happened"`, and so on.

## 24. Staging people the engine can draw

People are drawn from the side, the front or the back (section 18). There is no view from above and no three-quarter view. This section says how to stage any story inside that limit, so no model invents its own people.

### Staging rules

- **Face the way you move and the way you look.** A person faces the thing they act on. In side view use `flip` to face left.
- **Two people talking** stand in profile, facing each other, 150 to 220 units apart, the speaker a little larger in frame. Cut between them with a whip, or hold both in a MEDIUM.
- **Keep screen direction.** If the boy runs left to right in one part, he runs left to right in the next. Write the direction in the continuity notes. Only a story reason turns him round.
- **Someone looking at the viewer** uses the front view. Use it rarely, for the line that matters.
- **A person seen from behind** uses the back view. For an over-the-shoulder shot, a dark foreground shape in front of the camera (layer 1.7) as their shoulder or head outline also works, with the subject beyond it.
- **A view from above** (a map view, a body on a table) is drawn as an asset or an explainer picture, not with `person()`. A lying person is still drawn from the side with the `lying` pose.
- **At most three people on the subject layer** in one shot. More is a crowd.

### Crowds

A crowd is an asset, not many `person()` calls. Draw it as one dark shape of heads and shoulders on the middle layer (0.5), in a mix of the ground colour and indigo, with two or three hat shapes and no faces. One or two real people stand in front of it on the subject layer.

### Children, old people, babies

- Children and old people: section 18.
- A baby is a bundle asset: a wrapped oval with a small round head and a closed-eye arc, sized to the arms of the carrier and placed at `handPos`.

### Animals

There is no animal engine. An animal is an asset with moving parts, made in MODE: ASSETS.

1. One body shape, one head shape, a tail or wing, and legs as two to four short bars.
2. Options: `x`, `y`, `t`, `flip`, and `walk` (0 to 1).
3. Motion comes from `t` inside the asset: legs swing with `Math.sin(t * speed)`, the body bobs 2 to 4 units, the head nods half as much. A bird flaps: the wing is one shape that scales in height from 1 to -0.6.
4. Size it against a person in the sheet check. A duck reaches the ankle. A dog reaches the knee to the hip. A horse's back is at the shoulder.
5. Animals have a dot eye and no feelings. Their story is told by motion: fast, still, turning away.
6. A group of animals is the same asset drawn several times with different `t` offsets and sizes, never in a neat row.

### People in vehicles and behind things

- A person in a vehicle is drawn first, then the vehicle body over them, so only the head and shoulders show through the window. The window is a see-through shape in the vehicle asset.
- A person behind a wall, a counter or a bed is drawn before it in the same layer.
- A person in water is drawn, then a water shape with 0.7 to 0.85 opacity over the lower body.

### Indoors

- The room is the far layer (0.14): one wall colour, a door or window, one or two pieces of furniture as assets.
- The floor is the ground of the subject layer. Use the `lamp` mood, or a mood object with warm ground.
- A window or a lamp is the light source. Put `FX.lamp` at its place and light people from that side.
- A ceiling is never shown. The top of the frame is wall.

### Hands and things

- A held thing is drawn at `handPos(...)` after the person, so it sits on the hand.
- A carried person is placed at the carrier's arms and moves with the carrier's bob (see the run in part 1).
- Two people touching (a hand on a shoulder, pulling someone up): pose the reaching arm with `aF`, then check the frame. Change the arm angles until the hand meets the other body. Never leave a gap.

### When the story needs what the engine cannot do

Say it under LIMITS in your reply, use the nearest staging from this section, and carry on. Never draw a custom person. A slightly simpler staging in the same style is always better than a richer picture in a different style.

## 25. Instruments, numbers and explainer pictures

Scripts are full of numbers and ideas: a temperature, a timer, "two hours", "think of the brain like a phone". These need a fixed look, or every part invents its own.

### Instruments (anything that shows a number)

All instruments share one design, taken from the thermometer in part 1:

| Part of the design | Value |
| --- | --- |
| Body | cream `#F3E4BE`, corner radius about a quarter of its height, gold line `#D9B45A` 1.5 wide |
| Screen | dark `#10182C`, small corner radius |
| Digits | mint `#BFF3D0`, JetBrains Mono (or any monospace), bold |
| Unit | same mint, right after the digits or small beside them |
| One accent | a single red dot or needle `#C8402F` |
| Tilt | held instruments lean 10 to 25 degrees. Mounted ones are straight |

Rules:

- An instrument belongs to the world. It is held in a hand, worn on a wrist, or fixed to a wall or a machine. It never floats like an app screen.
- The number **moves to the said value and lands on the word**. Count for 0.6 to 1.2 seconds, then hold still.
- Show the unit the voice says. If the voice says Celsius, the screen says °C.
- One instrument on screen at a time. Frame it with `shot('DETAIL', ...)` so it fills two thirds of the width, then whip back to the person it belongs to.
- A clock or timer that shows time passing runs fast between two values while the light changes with it.
- The same instrument is the same asset in every part. Make it once in MODE: ASSETS with a `val` option.

Standard instruments to make when the plan needs them: thermometer (`thermoGun`, in the library), wall thermometer, stopwatch, heart monitor, phone battery, clock, scale. Each takes `val` and draws its own digits.

### Explainer pictures (for ideas, not events)

When the voice explains how something works, leave the story world for a simple diagram in the same style. Sonnet and other models tend to keep showing the story world here, and the picture stops matching the words.

- **Enter and leave clearly.** Whip or push into an object in the story world (the boy's head, a phone in a pocket) and arrive in the explainer picture. Leave the same way. Use a `dip` only between parts.
- **Background.** One flat deep indigo or night colour with a soft vignette. No ground line, no sky. Draw it with `X.full()` and set `X.sky = false`.
- **The subject** is one large simple shape in the centre: a head outline with a brain shape, a heart, a cell, a battery. Cream outline, flat fills, one gold line. No real anatomy detail.
- **A colour code, stated once and kept**: red-orange `#C8402F` = warm, active, using energy. Blue `#5C7AA8` = cold, slow, saving energy. Gold = the thing to look at. Mint = a reading.
- **Show change, not labels.** A level drops, a glow fades, dots slow down. If the voice says "like a phone on low power", draw the battery and let it drain as the words are said.
- **A metaphor is shown literally, then tied back.** "Think of the brain like a phone": show the phone, then the phone's shape becomes the brain's shape, keeping the battery level.
- **Text** is only what an instrument would show: a number and a unit. Captions carry the words.
- **Motion** in an explainer is slow and smooth. No whips inside it and no hits above 5. The energy drops here on purpose, so the return to the story feels fast.
- An explainer picture lasts 3 to 8 seconds. Longer than that, cut back to a person for one beat.

Explainer subjects that more than one part uses (the brain, the battery) are library assets made in MODE: ASSETS.

## 26. Formats

The stage is chosen once for the whole project, in the plan: `"stage": "vertical"` or `"stage": "wide"`. Every part of a project uses the same stage. If the plan has no `stage`, it is vertical.

| Format | Stage | Status | Engine numbers |
| --- | --- | --- | --- |
| Vertical 9:16 | 540 x 960 | Approved. The worked example is vertical | Centre (270, 610). Captions 58 px at y 728 |
| Wide 16:9 | 960 x 540 | Works. New in version 5, not yet used for a full video | Centre (480, 352). Captions 44 px at y 478 |
| Square 1:1 | none | Not supported | Tell the user. Offer vertical or wide |
| Still image | either | Supported | Build the part, then name the time to capture: `seek(t, id)` |

Rules for the wide stage:

- Everything else is the same: the five layers, the people, the assets, the moods, blur, shake, joins, the checks.
- `shot()` gives the right key for the stage by itself. Zoom numbers are about 0.6 times the vertical ones. Do not copy camera keys from a vertical part into a wide part.
- A wide frame holds more of the place and more people side by side. Use it: two or three people in one MEDIUM, the subject off centre with `ox`, a foreground shape on one side.
- A wide frame is short. A FULL shot of one standing person leaves empty sides, so pair it with a second person, a vehicle or a foreground shape.
- For anything full-screen (an explainer background, an under-water place, a flash) use `STAGE.W` and `STAGE.H`, never 540 and 960.
- A part written for one stage is not valid on the other. To make both formats, plan two projects from the same script.
- Never stretch, crop or letterbox one format into the other.

The stage numbers, the caption place and the `shot()` sizes are engine constants. A model never changes them.

Older sections (3, 4 and the PLAN and SCENE blocks of section 12) describe an earlier wide method with a true ground plane, a lens `P` and units where an adult is about 190 tall. They stay as background on how depth and light should look. For building, the project engine wins: the stage above, the five layers, and units where a standing adult is about 340 tall.

## 27. Delivery rules for every model

These rules stop the most common ways a reply breaks the file.

### Returning code

- Return **either** the whole file **or** exactly one complete block (the `script data-part="N"` block with its opening and closing tags, or the asset or cast lines you added). Say which.
- Never write "the rest is unchanged", "same as before" or `...` inside code. Code you return is complete and runs as it is.
- Never shorten, reformat or "tidy" the rulebook, the plan, the engine, the library, the player or another part.
- Never rename anything that exists.
- No images, no fonts to download, no libraries, no network calls, no audio data in the file.

### If you cannot open a browser

Many models cannot run the page. Then check by reasoning, and say so:

1. For every camera key, work out where the subject lands: `X = STAGE.cx + (wx - x) * s`, `Y = STAGE.cy + (wy + y) * s` (270 and 610 on the vertical stage, 480 and 352 on the wide stage). The head must be inside the frame and above the captions.
2. Walk the `LINT()` list in section 16 by hand: times, words a second, key order, zoom range, rests, hits.
3. Read `draw` once for each beat time and list what is on screen. Check it against the words.
4. Write `NOT RUN: checked by reasoning` in your reply, so the user knows to look at the Checks tab.

### If the file is too long for you

Read in this order and stop when you must: section 21, 14, 15, 16, then the plan entry for your part, then part 1 as the example, then the sections for your task (17 for assets, 18 for people, 19 for improving, 24 and 25 for staging). Return only your block.

### If something is unclear or missing

Do not stop to ask. Choose the simplest thing that obeys the plan and the locks, and list it under ASSUMPTIONS. Stop only when a stage is missing (section 16) or the audio cannot be matched (section 15).

## 28. For the user: how to run a project

This section is for the person, not the model.

1. **Open the file** in a browser. Press **Audio** and pick your narration file once.
2. **Ask tab.** It lists every step with a prompt to copy. Do them from the top.
3. **Plan.** Give a model this file, your narration and prompt 1 with your full script. It gives the file back. Open the **Parts** tab and read the list. If a part starts or ends at the wrong sentence, say so and it fixes the plan.
4. **Assets and people.** Prompts 2 and 3. Look at the **Assets** and **Cast** tabs. Say what looks wrong ("the sled is too big", "the diver looks like the medic"). Approve before going on. After this, do not change them.
5. **Parts.** Give the approved file to any chat with the prompt for one part. You can run several chats at once with the same file.
6. **Check a part.** Open the file it returns. The **Video** tab plays it with the voice. The **Checks** tab must show all PASS. Under the video, the SYNC line shows the first and last words: they must be the words you hear.
7. **Improve.** Use the Improve prompt and say what you want in plain words, with the time in seconds: "at 6 s the boy is too small", "the fall at 12 s is too slow".
8. **Join.** Parts tab, **Add parts from files**, pick the returned files, **Save joined file**. Play **All**.
9. **Record** the joined file to MP4 (ask a model with tools: "record this file", section 14).

How to give feedback that models understand: the part number, the time in seconds, what you see, what you want. One problem per line.

What the words mean:

| --- | --- |
| Part | One piece of the video, 12 to 25 seconds, built in one request |
| Plan | The list of parts with their times and words, inside the file |

## 30. Special shots: zoom and inside views

Explainer videos go viral with a few clever moves: the camera flies into an eye and we are inside the body, a see-through window shows the bones, a building is torn open to show the rooms. The engine has one call for each. Use them only where the words call for it: **at most one special shot every 15 seconds**, each one starting on its word with `T('word')`, lasting **0.8 to 1.6 seconds** to move in and holding long enough to read.

Two kinds of call:

- **Screen calls** (`dive`, `pull`, `xray`, `cutaway`, `lens`) take whole pictures, the svg that `X.lay(...)` and `X.full(...)` give you, and return the final picture. Build the normal view and the inside view as two strings, then `return ZOOM.dive(t, T('eye'), 1.2, outer, inner, {x: 300, y: 420, r: 26})`. Positions are screen pixels (0 to `STAGE.W`, 0 to `STAGE.H`).
- **World calls** (`exploded`, `scale`, `bones`, `ref`) return shapes in world units for inside `X.lay(1, ...)`, next to people and assets.

| Shot | Call | Use it for |
| --- | --- | --- |
| Dive in | `ZOOM.dive(t, t0, dur, outer, inner, {x, y, r})` or `{x, y, w, h}` | Into an eye, a wound, a cell, a screen, a keyhole. The point stays still while the world grows, a gold-edged window opens and the inside view fills the screen. After `t0 + dur` only `inner` is drawn |
| Pull back | `ZOOM.pull(t, t0, dur, inner, outer, {x, y, w, h})` | The reverse: start inside (the news footage, the photo, the cell) and pull out until it sits in its frame inside the bigger world (the TV in a room, the photo in a hand) |
| X-ray / inside view | `ZOOM.xray(t, t0, t1, outside, inside, {x, y, r})` or `{x, y, w, h}`, `ghost` | A glowing blue see-through window, open from `t0` to `t1`, that may move with `t`. Draw the inside in `XR` colours: `XR.line` lines on `XR.bg`, `XR.hurt` for the hurt place |
| Bones of a person | `ZOOM.bones(x, y, h, {organs, hurt, beat})` | The inside of a person for an x-ray: a front skeleton `h` tall with its feet at `x, y` (for a cast member use `h = CAST.name.scale * 340`). `organs: true` adds lungs and a heart that beats with `beat: t`; `hurt: 'armF'` (`armB`, `legF`, `legB`, `head`, `chest`, `heart`) turns that bone red with a pulsing ring |
| Cutaway | `ZOOM.cutaway(t, t0, t1, front, inside, {x, y, w, h, from, bg})` | The front of a house, a body or a machine tears open like paper (from `'left'`, `'right'` or `'top'`) and the inside shows on `bg`, with a cream torn edge and a gold line |
| Magnifying lens | `ZOOM.lens(t, t0, t1, scene, {path: [[t, x, y], ...], r, k})` | A glass moves along `path` and shows the same scene `k` times bigger inside it. For small writing, a tiny part, a crack |
| Exploded view | `ZOOM.exploded(t, t0, pieces, {dur, stagger, back, size})` | The pieces of a thing float apart one after another with gold labels. `pieces = [{svg, dx, dy, label, ax, ay, lx, ly}]`: how far each moves, where its label line starts and where the label sits (keep labels inside the frame). `back: T('word')` brings them back together |
| Scale comparison | `ZOOM.scale(t, t0, {x, y, h, ref, side, label, gap})` | A grey known thing (`'person'` 340, `'child'` 230, `'car'`, `'bus'`, `'house'`, `'elephant'`) slides in beside the subject with a gold measuring bar and a label (`'12 m'`, or the times bigger, `'x 6'`, by itself). `ZOOM.ref(name, x, y)` draws only the grey thing |
| Helpers | `ZOOM.k(t, t0, dur)`, `ZOOM.on(t, t0, t1)` | The eased 0 to 1 progress of a move, and 0 to 1 while a view is open (soft in and out) |

Rules:

1. **The words decide.** A dive happens on the word that names the inside ("inside", "cells", "the screen showed"); an x-ray on "bone", "broken", "heart"; a scale on the number.
2. **The inside view is a full picture.** It paints its own background over the whole stage (a `rect` of `STAGE.W` x `STAGE.H`) and has its own life (moving cells, a beating heart, drifting dust). Set `X.sky = false` while only the inside shows.
3. **Keep the point still.** For a dive, `x, y` is where the thing is on screen at `t0`; the camera keys hold still during the dive (the call does the zoom).
4. **Come back the same way.** After a dive, return with a `pull` into the same window, or join to the next beat with a whip. Never cut back.
5. **Continuity holds inside.** The hurt arm in the x-ray is the same arm the state sheet bandaged; the inside of the house matches the outside.
6. **One special shot at a time.** Never put an x-ray inside a lens inside a dive.
7. **Captions stay on top.** The engine draws captions over every special shot; keep the important inside detail away from the caption line.

## 31. Frames within the frame and seamless moves

The clever news shot: we start inside the TV, then pull out and see the family watching. The sea shot: we ride on the boat, then the camera slides under the water without a cut. These moves keep the viewer inside one flow.

### Frames that hold a picture

`FRAME.show(kind, inner, {x, y, w, text})` draws a thing that holds a picture, in screen px, with `inner` (a full picture, built like the inside view of a dive) shown in its window. `FRAME.box(kind, x, y, w)` gives its window `{x, y, w, h}` in the right shape. Kinds:

| Kind | Looks like | `text` shows |
| --- | --- | --- |
| `tv` | A dark set with a gold edge, scan lines and a blinking red light | A red news bar ("BREAKING: BOY FOUND") |
| `phone` | A phone with a gold edge | The clock or a message at the top |
| `paper` | A newspaper page; the picture is printed in greys | The headline |
| `photo` | A tilted white-bordered photo | A handwritten caption under it |
| `poster` | A paper poster | A big red title |
| `window` | A wooden window with a cross bar and a glint | |
| `eye` | An eye; the picture shows in the eye, under the iris ring | |
| `diary` | A lined diary page; the picture is a grey sketch | A handwritten line |

**The pull-out:** draw the room with the frame showing the picture, then pull out of the same window, so the last frame of the pull is exactly the room:

```
const b = FRAME.box('tv', 270, 300, 300), news = newsPicture(t);
const room = X.lay(1, ...) + FRAME.show('tv', news, Object.assign({text: 'BREAKING'}, b));
return ZOOM.pull(t, T('watching'), 1.4, news, room, b);
```

Dive into a frame the same way with `ZOOM.dive(t, t0, dur, room, news, b)`. A frame that stands in the world (a TV on a table) is placed with `X.screen(worldX, worldY, f)`, which gives where a world point of layer `f` is on screen now.

### Seamless moves

| Move | Call | Use it for |
| --- | --- | --- |
| Over-under | `MOVE.waterline(t, t0, dur, above, below, {from, to})` | A wavy water line splits the screen; above it the air view, below it the water view. Move the line from the bottom (`from: STAGE.H - 60`) to above the top (`to: -40`) to go under, the reverse to come up |
| Ground dive | `MOVE.through(t, t0, dur, a, b, {dir: 'down'})` | A band of earth layers sweeps down the screen and the place below appears (roots, a cave, a pipe, a buried thing) |
| Through the wall | `MOVE.through(t, t0, dur, a, b, {dir: 'right', edge: 'wall'})` | A band of bricks sweeps across and we are in the next room |
| Wipe on an object | `MOVE.wipe(t, t0, dur, a, b, {svg: x => ..., w})` | Something close to the camera crosses the screen (a pillar, a bus, a person); the picture changes behind its edge. Without `svg` a dark pillar is used |
| Follow | `P.TRACK` and `P.cam` (section 14) | The camera locks onto a moving person; the world streams past |
| Crane up or down, vertical pan, parallax push | `...MOVE.keys('crane', t0, t1, [x, y, zoom], {by})` inside `P.KEYS`; also `'drop'`, `'pan'`, `'push'` | Rising over a place to show where we are, dropping into a scene, sliding up a tall thing, a slow push in where the layers move at different speeds |
| Morph | `MOVE.morph(t, t0, dur, a, b)` | One picture melts into the next |

Rules: the move starts on its word; the two pictures should share something (the water line, the wall, the same person) so the eye follows; never more than one seamless move in a row.

## 32. Time and place

When a story jumps in time or place, the viewer must know at once. Every call starts on a word and fades in and out by itself.

| Tool | Call | Use it for |
| --- | --- | --- |
| Flashback | `TIME.flashback(t, t0, t1, svg)` | Wrap the picture: from `t0` to `t1` it turns to warm greys with soft dark edges and faint film lines, with a white flash going in and coming out. `TIME.past(svg, k)` gives the look at strength `k` |
| Date card | `TIME.card(t, t0, t1, 'March 1999', {sub: 'Norway', x, y})` | A paper card with the date |
| Calendar flip | `TIME.calendar(t, t0, dur, ['MON 3', 'TUE 4', ...], {x, y, w})` or a number of days with `{start}` | Pages tear off one after another: days passing |
| Clock spin | `TIME.clock(t, t0, dur, fromHour, toHour, {x, y, r})` | The hands race (`toHour` may pass 12: 9 to 33 is a whole day) |
| Counter | `TIME.counter(t, t0, dur, 1950, 2024, {sub: 'years later', pre, post, size})` | A number rolls: years, days, metres, people |
| Rewind | draw the part at `TIME.back(t, t0, dur, span)` and add `TIME.rewind(t, t0, dur)` | The story runs backwards over `span` seconds, with streaks and the rewind sign |
| Timeline bar | `TIME.timeline(t, t0, dur, {marks: ['1990', '2000', '2024'], from, to, y})` | A marker travels along the years |
| Map line | `PLACE.map(t, t0, dur, {points: [[.2, .3, 'Oslo'], [.8, .4, 'Hospital']], x, y, w, h})` | A paper map; a dashed red line draws from pin to pin (points from 0 to 1 across the map) |
| Location card | `PLACE.card(t, t0, t1, 'Lake Tyrifjorden', 'Norway')` | A pin and the place name |
| Globe | `PLACE.globe(t, t0, dur, {x, y, r, turn, pinAt: [lon, lat]})` | The earth turns and a pin drops (`lon`, `lat` from -1 to 1 on the face) |

Rules: a jump in time needs one of these on the first word of the new time (the plan's `in: 'dip'` alone is not enough); the flashback look lasts exactly as long as the past does; cards sit away from the caption line and faces.

## 33. Explaining and emphasis

Tools that make an idea clear and make the big moment land. Screen px unless the call says otherwise.

| Tool | Call | Use it for |
| --- | --- | --- |
| Name tag | `SHOW.tag(t, t0, t1, {x, y, name, role, color})` | Who this is, the first time they matter. Put it near them with `X.screen(...)` |
| Callout | `SHOW.callout(t, t0, t1, {x, y, lx, ly, text})` | A pulsing ring on a point and a gold line to a label ("7 °C", "the broken bone") |
| Gauge | `SHOW.gauge(t, t0, t1, {min, max, from, value, unit, label, round, zones, x, y, r})` | A dial whose needle moves: body heat, speed, risk |
| Split screen | `SHOW.split(t, t0, a, b, {dir, labels: ['THEN', 'NOW']})` | Two pictures side by side (one above the other on the vertical stage). Keep both subjects in the middle of their pictures |
| Inset | `SHOW.inset(t, t0, t1, main, small, {x, y, w, h})` | A small picture over the main one: a face reacting, a close-up of the number |
| Diagram draw-on | `SHOW.draw(t, t0, dur, ['M..', 'M..'], {color, width, stagger})` | Lines draw themselves: arrows, a route, a graph, the outline of an organ |
| Spotlight | `SHOW.spot(t, t0, t1, {x, y, r})` | Everything darkens except one circle on the key thing |
| Iris | `SHOW.iris(t, t0, dur, {x, y, open})` | A circle closes to black on a point (an ending) or opens from it |
| Slow motion | draw the part at `SHOW.slowT(t, t0, t1, k)` | The world slows to `k` (0.3 = a third) for the key moment, then carries on |
| Match cut | `SHOW.match(t, t0, a, b)` | Two pictures with the same shape in the same place (a full moon, then a plate) swapped with a short flash |
| Shake | `SHOW.shake(t, t0, svg, amp)` | A hard shake for an explosion or a crash. Small hits stay in `P.HITS` |
| Silence beat | `SHOW.hush(t, t0, t1)` | In a long pause of the voice the picture holds, dims a little and the edges close in |

### Paper transitions

| Transition | Inside a part | As a join between parts |
| --- | --- | --- |
| Page turn | `TURN.go('page', t, t0, dur, a, b)` | `in` / `out`: `'page'` |
| Fold | `TURN.go('fold', ...)` | `'fold'` |
| Flats (paper bands slide across) | `TURN.go('flats', ...)` | `'flats'` |
| Ink wash | `TURN.go('ink', ...)` | `'ink'` |

A paper join is for a chapter change or a jump into an explainer picture; the `out` of a part and the `in` of the next are the same word, as with `whip` and `dip`. The engine draws the join by itself.

Rules: at most two explaining tools on screen at once; each one says something the words are saying now; never cover a face or the caption line.

/* ============ the LOOKS library: new hair, hats and outfits plug in here (rulebook section 18) ============ */
/* built-in looks are drawn inside person(); new ones are added with HAIR() and OUTFIT() in the cast block */
const LOOKS={hair:{},outfit:{},builtinHair:['bun','grey','beanie','cap'],builtinOutfit:['medic','boy','mother','doctor','gown']};
function HAIR(name,d){LOOKS.hair[name]=d;}
function OUTFIT(name,d){LOOKS.outfit[name]=d;}
function lookHair(ch,view,layer,g){const d=LOOKS.hair[ch.hat];if(!d||!d[view]||typeof d[view][layer]!=='function')return '';try{return d[view][layer](g)||'';}catch(e){console.warn('hair '+ch.hat+': '+e.message);return '';}}

 determined:{b:[14,-1],e:.85,eye:'open',ps:1,look:[.6,0],m:{kind:'line',c:-.15,o:0},blush:.3,body:{torso:5,head:3,hF:'fist',hB:'fist'}},
 pain:{b:[16,-2],e:1,eye:'squeeze',ps:1,look:[0,0],m:{kind:'grit',c:0,o:.7},blush:.5,extra:['sweat'],body:{torso:15,head:10,sh:5,aF:[-14,-92],hF:'fist'}},
 exhausted:{b:[-8,-2],e:.5,eye:'open',ps:1,look:[.1,.9],m:{kind:'open',c:-.3,o:.28},blush:.7,extra:['sweat','breath'],body:{torso:12,head:14,sh:-4,aF:[8,-4],aB:[-2,-4]}},

 thinking:{b:[6,2],e:.9,eye:'open',ps:1,look:[.7,-.7],m:{kind:'line',c:-.1,o:0},blush:.3,body:{head:-6,aF:[-34,-122],hF:'point'}},

/* ============ poses (joint angles in degrees; + turns a hanging limb backward) ============ */
const TH=64,SH=62,GROUND=TH+SH+12;
const POSES={

 run:{root:[0,0],torso:17,head:-8,aF:[0,-80],aB:[0,-80],lF:[0,0],lB:[0,0],walk:{amp:44,knee:78,arm:46,bend:82,speed:9.5,bob:9},hF:'fist',hB:'fist',act:.3},
 reach:{root:[0,0],torso:7,head:-3,aF:[-80,-12],aB:[12,-10],lF:[-9,4],lB:[11,2],hF:'open'},
 carry:{root:[0,0],torso:-5,head:2,aF:[-36,-80],aB:[-30,-82],lF:[-6,4],lB:[8,0],hF:'open',hB:'open',act:.4},
 pull:{root:[0,0],torso:15,head:-6,aF:[0,-20],aB:[42,-8],lF:[0,0],lB:[0,0],walk:{amp:22,knee:36,arm:14,bend:20,speed:4.6,bob:4,lockB:1},hB:'fist',act:.3},
 crouch:{root:[72,0],torso:22,head:-8,aF:[-44,-40],aB:[-30,-44],lF:[-74,134],lB:[-60,124],hF:'open'},
 sit:{root:[GROUND-15,0],torso:-9,head:2,aF:[-30,-34],aB:[-22,-30],lF:[-86,6],lB:[-78,10]},
 kneel:{root:[GROUND-TH-12,0],torso:34,head:16,aF:[-44,-4],aB:[-40,-4],lF:[-8,96],lB:[2,90],pump:1,hF:'open',hB:'open'},
 lying:{root:[GROUND-30,-90],torso:0,head:4,aF:[10,6],aB:[-8,0],lF:[4,2],lB:[-3,0]},
 fall:{root:[18,26],torso:-12,head:-10,aF:[-142,-24],aB:[128,-34],lF:[-42,56],lB:[22,74],hF:'open',hB:'open',flail:1},
 cheer:{root:[0,0],torso:-4,head:-8,aF:[-128,-36],aB:[136,-30],lF:[-6,2],lB:[7,0],hF:'open',hB:'open'}
};
let UID=0;
/* ============ life: small motions that keep every asset alive (rulebook section 9, Background life) ============ */
let NOW=0;   // the clock of the frame being drawn; the scene engine sets it every frame
const LIFE={
 t:o=>o&&o.t!=null?o.t:NOW,                                                   // the clock inside an asset: LIFE.t(o)
 sway:(t,amp,spd,ph)=>amp*Math.sin(t*(spd||1.3)+(ph||0)),                     // trees, lamps, flags, hanging things (degrees or units)
 bob:(t,amp,spd,ph)=>amp*Math.sin(t*(spd||2)+(ph||0)),                        // floating, idling engines, breathing objects
 flicker:(t,ph)=>.86+.14*Math.sin(t*17+(ph||0))*Math.sin(t*7.3+1.7*(ph||0)),  // flames, old bulbs, screens: a 0.72 to 1 strength
 blink:(t,per,on,ph)=>((t+(ph||0))%(per||1.2))<(on||.15),                     // LEDs, beacons, cursors: true while lit
 drift:(t,spd,len,ph)=>{const L=len||100;return (((t*(spd||10)+(ph||0))%L)+L)%L;}, // mist, clouds, smoke, snow: 0 to len, looping
 pulse:(t,bpm,ph)=>{const x=((t*(bpm||72)/60)+(ph||0))%1;return Math.exp(-x*9);},// heartbeats, alarms: 1 on the beat, fading
 spin:(t,rps,ph)=>((t*(rps||.5)*360)+(ph||0))%360                              // wheels, fans, clock hands: degrees
};
/* ============ conditions: injuries, dirt and wear that stay from shot to shot (rulebook section 6, Conditions) ============ */
// X.who(state, size, view, cond)  cond = {wet, cold, dirt, soot, torn, frost, bruise, blood, pale (0 to 1), sweat:1, sling:1, bandage:'head'|'armF'|'armB'|'legF'|'legB' or a list}
function condOf(o){const c=Object.assign({},(o&&o.cond)||{});if(o&&o.state)String(o.state).split(/[\s,+]+/).forEach(w=>{if(w==='wet'||w==='cold')c[w]=1;});
  if(c.bandage&&!Array.isArray(c.bandage))c.bandage=[c.bandage];return c;}
function seedOf(str){let h=7;for(const q of String(str||''))h=(h*31+q.charCodeAt(0))>>>0;return ()=>{h=(h*1103515245+12345)>>>0;return (h>>>8)/16777216;};}
const COLD_C={dirt:'#6B5434',soot:'#2A2730',blood:'#9E2A1C',bruise:'#6E4A7A',frost:'#EEF6FF',band:'#F3E4BE'};
/* marks on the coat: dirt and soot patches, rips, a small stain, frost on the shoulders. Positions come from the person's name, so they never move between shots */
function condTorso(C,ch,L,R,T,B,adj){const rnd=seedOf(ch.name+'|t');let s='';const W=R-L,H=B-T;
  const blob=(col,a,y0,y1)=>{const x=L+W*(.12+.76*rnd()),y=T+H*(y0+(y1-y0)*rnd()),rx=5+9*rnd(),ry=3.5+6*rnd(),r=Math.round(rnd()*180);return `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="${rx.toFixed(1)}" ry="${ry.toFixed(1)}" transform="rotate(${r} ${x.toFixed(1)} ${y.toFixed(1)})" fill="${col}" opacity="${a.toFixed(2)}"/>`;};
  if(C.dirt){const n=Math.round(2+4*C.dirt);for(let i=0;i<n;i++)s+=blob(adj(COLD_C.dirt),.28+.42*C.dirt,.35,.95);}
  if(C.soot){const n=Math.round(2+4*C.soot);for(let i=0;i<n;i++)s+=blob(adj(COLD_C.soot),.3+.45*C.soot,.15,.9);}
  const rip=(x,y,w,h,fill)=>{let d='';const n=9;for(let i=0;i<n;i++){const a=i/n*Math.PI*2,j=i%2?.55:1;d+=(i?'L':'M')+(x+Math.cos(a)*w*j*(.8+.3*rnd())).toFixed(1)+','+(y+Math.sin(a)*h*j*(.8+.3*rnd())).toFixed(1);}
    return `<path d="${d}Z" fill="${fill}" stroke="${adj(mix(ch.coat,P.cream,.55))}" stroke-width="1.1" stroke-linejoin="round"/>`;};
  if(C.torn){const n=C.torn>.5?2:1;for(let i=0;i<n;i++)s+=rip(L+W*(.25+.5*rnd()),B-8-H*.3*rnd(),6+4*rnd(),4+3*rnd(),adj(mix(ch.coat,'#131A38',.62)));}
  if(C.blood){const x=L+W*(.55+.25*rnd()),y=T+H*(.3+.3*rnd()),r=4+5*C.blood;s+=`<path d="M${x},${y-r}q${r*1.2},${r*.3} ${r*.6},${r*1.3}q-${r*.5},${r*.5} -${r*1.2},${r*.1}q-${r*.5},-${r*.9} ${r*.6},-${r*1.4}Z" fill="${adj(COLD_C.blood)}" opacity="${(.55+.35*C.blood).toFixed(2)}"/>`;}
  if(C.frost){for(let i=0;i<9;i++){const x=L+W*rnd(),y=T+4+10*rnd();s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1+1.6*rnd()).toFixed(1)}" fill="${COLD_C.frost}" opacity="${(.5+.4*C.frost).toFixed(2)}"/>`;}}
  return s;}
/* marks on a limb, in the limb's own frame (y runs down the limb from the joint) */
function condLimb(C,ch,key,len,w,adj){const rnd=seedOf(ch.name+'|'+key);let s='';
  if(C.bandage&&C.bandage.includes(key)){const y=len*.35,h=Math.max(10,len*.32);s+=`<rect x="${(-w/2-1.5).toFixed(1)}" y="${y.toFixed(1)}" width="${(w+3).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${adj(COLD_C.band)}" stroke="${P.gold}" stroke-width=".9"/><path d="M${(-w/2).toFixed(1)},${(y+h*.35).toFixed(1)}l${w},${(-h*.12).toFixed(1)}M${(-w/2).toFixed(1)},${(y+h*.7).toFixed(1)}l${w},${(-h*.12).toFixed(1)}" stroke="${adj(mix(COLD_C.band,'#131A38',.25))}" stroke-width="1"/>`;
    if(C.blood)s+=`<circle cx="${(w*.1).toFixed(1)}" cy="${(y+h*.5).toFixed(1)}" r="${(2+2*C.blood).toFixed(1)}" fill="${adj(COLD_C.blood)}" opacity=".7"/>`;}
  if(C.dirt&&rnd()<.4+C.dirt*.6)s+=`<ellipse cx="${((rnd()-.5)*w*.4).toFixed(1)}" cy="${(len*(.45+.4*rnd())).toFixed(1)}" rx="${(w*.32).toFixed(1)}" ry="${(4+4*rnd()).toFixed(1)}" fill="${adj(COLD_C.dirt)}" opacity="${(.25+.4*C.dirt).toFixed(2)}"/>`;
  if(C.soot&&rnd()<.4+C.soot*.6)s+=`<ellipse cx="${((rnd()-.5)*w*.4).toFixed(1)}" cy="${(len*(.3+.5*rnd())).toFixed(1)}" rx="${(w*.3).toFixed(1)}" ry="${(4+4*rnd()).toFixed(1)}" fill="${adj(COLD_C.soot)}" opacity="${(.3+.4*C.soot).toFixed(2)}"/>`;
  if(C.torn&&key.startsWith('leg')&&rnd()<.5+C.torn*.5){let d='';for(let i=0;i<8;i++){const a=i/8*Math.PI*2,j=i%2?.55:1;d+=(i?'L':'M')+(Math.cos(a)*w*.3*j).toFixed(1)+','+(3+Math.sin(a)*5*j).toFixed(1);}s+=`<path d="${d}Z" fill="${adj(ch.skin)}" stroke="${adj(P.cream)}" stroke-width=".9" stroke-linejoin="round"/>`;}
  return s;}
/* marks on the head, in head units k(v) (radius 1, centre 0,0; side view faces +x) */
function condHead(C,ch,k,view,adj){let s='';const fr=view==='front',bk=view==='back',cx=v=>fr?k(v-.55):k(v);
  if(C.bandage&&C.bandage.includes('head')){s+=`<path d="M${k(-1.02)},${k(-.62)}Q0,${k(-.86)} ${k(1.02)},${k(-.62)}L${k(1.04)},${k(-.36)}Q0,${k(-.58)} ${k(-1.04)},${k(-.36)}Z" fill="${adj(COLD_C.band)}" stroke="${P.gold}" stroke-width="1"/>`;
    if(!fr)s+=`<path d="M${k(-1.02)},${k(-.5)}l${k(-.28)},${k(.18)}l${k(.08)},${k(.1)}Z M${k(-1.02)},${k(-.46)}l${k(-.2)},${k(.34)}l${k(.1)},${k(.04)}Z" fill="${adj(COLD_C.band)}" stroke="${P.gold}" stroke-width=".8"/>`;
    if(C.blood)s+=`<circle cx="${fr?k(.3):k(.55)}" cy="${k(-.52)}" r="${k(.07+.05*C.blood)}" fill="${adj(COLD_C.blood)}" opacity=".7"/>`;}

    if(t>tNot-.1){const q=Math.sin((t-tNot)*16)*Math.exp(-(t-tNot)*3);dp.aF=[dp.aF[0]+8*q,dp.aF[1]];dp.torso+=3*q;}
    g+=place(CAST.doctor,-150,0,dp,faceAt(t<tShout-.2?'determined':'shouting',t),X.who('normal'));
  }
  o+=X.lay(1,g,'mbAll');
  /* dark soft foreground shapes for depth */
  const fc=mix(m.gnd[1],'#0C1630',.72);
  o+=X.lay(1.7,`<path d="M-600,120Q-420,40 -230,96Q-120,130 -60,210V600H-600Z" fill="${fc}"/><path d="M420,150Q560,70 740,110Q880,150 900,260V600H420Z" fill="${fc}"/><path d="M1180,130Q1320,60 1500,104Q1640,140 1660,240V600H1180Z" fill="${fc}"/>`,'mbFg');
  return o;}
/* ============ under the ice (a full-screen place, no camera layers) ============ */
function under(t){const u=t-tUnder,dv=1-sm(clamp(u/.35)),up=sm(clamp((t-(tUp-.28))/.28));
  let o=`<rect width="540" height="960" fill="url(#deep)"/>`;
  const y0=-260*dv+520*up,sc=1+.05*u;
  o+=`<g transform="translate(270 480) scale(${sc.toFixed(3)}) translate(-270 ${(-480+y0).toFixed(1)})">`;
  const fp=poseAt('float',t);fp.aF=[fp.aF[0]+8*Math.sin(t*1.3),fp.aF[1]];fp.lF=[fp.lF[0]+6*Math.sin(t*1.1+1),fp.lF[1]];
  o+=place(CAST.boy,250+10*Math.sin(t*.8),640+8*Math.sin(t*1.1),fp,faceAt('limp',t),{light:'back',state:'cold',headR:43,t,size:1.7});
  o+=`<rect x="-200" y="-400" width="940" height="1800" fill="#040B1C" opacity=".8"/>`;
  o+=`<path d="M210,96L330,96L520,1300H20Z" fill="#BFE4FF" opacity="${ON.light?.13:.05}"/><path d="M244,96L296,96L380,1300H160Z" fill="#E6F4FF" opacity="${ON.light?.1:.03}"/>`;
  o+=`<path d="M-200,-300H740V70L640,96L560,60L470,104L400,84L330,96L210,96L150,70L60,110L-40,66L-200,100Z" fill="#8FB0D0" opacity=".55"/><path d="M-200,100L-40,66L60,110L150,70L210,96M330,96L400,84L470,104L560,60L640,96L740,70" fill="none" stroke="#EAF4FF" stroke-width="3" opacity=".7"/>`;
  const fr=clamp(u/2);o+=`<path d="M210,96l${-30*fr},${40*fr}l${10*fr},${-30*fr}l${-40*fr},${50*fr}M330,96l${34*fr},${44*fr}l${-8*fr},${-28*fr}l${40*fr},${46*fr}" fill="none" stroke="#EAF4FF" stroke-width="2.5" opacity="${(.8*fr).toFixed(2)}"/>`;
  for(let i=0;i<9;i++){const p=((t*.22+i*.137)%1),x=200+((i*71)%150);o+=`<circle cx="${x+8*Math.sin(t*2+i)}" cy="${(700-560*p).toFixed(1)}" r="${3+(i%3)*2}" fill="none" stroke="#CFE6F5" stroke-width="1.5" opacity="${(.6*(1-p)).toFixed(2)}"/>`;}
  return o+'</g>';}
/* ============ what is drawn at time t ============ */
P.draw=(t,X)=>{
  if(t>=tUnder&&t<tUp){const edge=t-tUnder<.3||t>tUp-.3;X.sky=false;X.grade=false;X.vig=.8;       // under the ice: own dark light, a vertical blur on the way in and out
    return X.full(under(t),edge?Math.min(50,Math.abs(X.vy)/90+26):0);}
  return surface(t,X);};
/* ============ this part's own light effects, drawn over the colour wash ============ */
P.over=(t,X)=>{let o='';
  if(t>17.3){const k=ez(t,17.3,17.7);o+=FX.lamp(k)+FX.beacon(t,k);}       // the warm ambulance door and the beacon
  return o+FX.flash(t,tNot);};                                             // a flash on "not"
})();
