<title>The Couple Test</title>
<style>
/* Layout: one 9:16 frame, centred, controls under it. Single deliberate khaki look. */
:root { --board: #AE9675; --ink: #2a211c; color-scheme: light; }
body { background: var(--board); color: var(--ink); font: 15px/1.5 "Segoe UI", system-ui, sans-serif; padding: 20px 16px 40px; }
.wrap { max-width: 460px; margin: 0 auto; display: grid; gap: 10px; }
.screen { aspect-ratio: 9 / 16; width: 100%; max-width: 100%; border-radius: 10px; overflow: hidden; background: #AE9675; }
.screen svg { width: 100%; height: 100%; display: block; }
button { font: 600 13px system-ui, sans-serif; color: var(--ink); background: transparent; border: 2px solid var(--ink); border-radius: 999px; padding: 5px 16px; cursor: pointer; justify-self: start; }
button:focus-visible { outline: 2px solid #E13B07; outline-offset: 2px; }
p { margin: 0; color: #4E4236; font-size: 13px; }
</style>
<div class="wrap">
  <div class="screen"><svg id="v" viewBox="0 0 1080 1920" role="img" aria-label="Animated test: a woman and a man talk and laugh"></svg></div>
  <button id="b" type="button">Pause</button>
  <p>8-second loop. Both people come from your style sheet. Only colours were changed and the movement was added with code; nothing was redrawn.</p>
</div>
<script>var RAW = { wm: __WM__, wf: __WF__ };</script>
<script>__DUO__</script>
<script>
(function () {
  DUO.init(RAW);
  var v = document.getElementById('v'), b = document.getElementById('b'), playing = !(matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches), t = 0, last = null, shown = -1;
  function draw() { var f = Math.floor(t * 24); if (f !== shown) { shown = f; v.innerHTML = DUO.frame(f / 24) } }
  function loop(now) { if (playing && last != null) t = (t + (now - last) / 1000) % DUO.DUR; last = now; draw(); requestAnimationFrame(loop) }
  draw(); requestAnimationFrame(loop);
  b.textContent = playing ? 'Pause' : 'Play';
  b.addEventListener('click', function () { playing = !playing; b.textContent = playing ? 'Pause' : 'Play' });
})();
</script>
