ing for his lost hat.","s":21.24,"e":23.948,"w0":52,"w1":59},{"i":8,"text":"And he points straight at the tall stranger,","s":24.127,"e":27.298,"w0":60,"w1":67},{"i":9,"text":"who moved in last week.","s":27.377,"e":29.061,"w0":68,"w1":72},{"i":10,"text":"The stranger laughs.","s":29.24,"e":30.66,"w0":73,"w1":75},{"i":11,"text":"He hates milk.","s":30.838,"e":31.862,"w0":76,"w1":78},{"i":12,"text":"But the strong man next door drinks four cups a day,","s":32.04,"e":35.905,"w0":79,"w1":89},{"i":13,"text":"and he never buys any.","s":35.984,"e":37.602,"w0":90,"w1":94},{"i":14,"text":"The strong man stamps his foot.","s":37.781,"e":40.027,"w0":95,"w1":100},{"i":15,"text":"Soon, everyone is shouting in the middle of the garden.","s":40.205,"e":44.182,"w0":101,"w1":110},{"i":16,"text":"Every single one of them is sure it was someone else.","s":44.36,"e":48.224,"w0":111,"w1":121},{"i":17,"text":"Kato needs proof.","s":48.403,"e":49.625,"w0":122,"w1":124},{"i":18,"text":"Before bed, he sprinkles white flour all around the cup.","s":49.803,"e":53.846,"w0":125,"w1":134},{"i":19,"text":"In the morning, the milk is gone again.","s":54.024,"e":56.878,"w0":135,"w1":142},{"i":20,"text":"But there are no footprints.","s":57.056,"e":59.071,"w0":143,"w1":147},{"i":21,"text":"Only one thin, wavy line,","s":59.249,"e":61.079,"w0":148,"w1":152},{"i":22,"text":"leading back into the soil.","s":61.158,"e":63.107,"w0":153,"w1":157},{"i":23,"text":"Nobody in the garden walks like that.","s":63.285,"e":65.961,"w0":158,"w1":164},{"i":24,"text":"So Kato makes a plan.","s":66.139,"e":67.757,"w0":165,"w1":169},{"i":25,"text":"He hides behind the bush,","s":67.936,"e":69.752,"w0":170,"w1":174},{"i":26,"text":"and he waits.","s":69.832,"e":70.789,"w0":175,"w1":177},{"i":27,"text":"Midnight.","s":70.968,"e":71.595,"w0":178,"w1":178},{"i":28,"text":"Nothing.","s":71.774,"e":72.335,"w0":179,"w1":179},{"i":29,"text":"One o'clock.","s":72.514,"e":73.306,"w0":180,"w1":181},{"i":30,"text":"Still nothing.","s":73.485,"e":74.475,"w0":182,"w1":183},{"i":31,"text":"Then the rain begins.","s":74.654,"e":76.173,"w0":184,"w1":187},{"i":32,"text":"The grass starts to move.","s":76.351,"e":78.168,"w0":188,"w1":192},{"i":33,"text":"Something small, slow and very pink pushes out of the ground,","s":78.346,"e":82.752,"w0":193,"w1":203},{"i":34,"text":"and crawls straight into the cup.","s":82.832,"e":85.21,"w0":204,"w1":209},{"i":35,"text":"It is a worm.","s":85.388,"e":86.445,"w0":210,"w1":213},{"i":36,"text":"When rain floods the soil,","s":86.623,"e":88.506,"w0":214,"w1":218},{"i":37,"text":"worms come up to the surface.","s":88.585,"e":90.699,"w0":219,"w1":224},{"i":38,"text":"Scientists think it helps them breathe and travel.","s":90.877,"e":94.444,"w0":225,"w1":232},{"i":39,"text":"And a warm cup is the driest bed in the whole garden.","s":94.623,"e":98.586,"w0":233,"w1":244},{"i":40,"text":"The worm never drinks the milk.","s":98.765,"e":101.011,"w0":245,"w1":250},{"i":41,"text":"It tips the cup climbing in,","s":101.189,"e":103.237,"w0":251,"w1":256},{"i":42,"text":"and the dry soil soaks up every drop.","s":103.316,"e":106.024,"w0":257,"w1":264},{"i":43,"text":"In the morning, Kato tells everyone.","s":106.203,"e":108.792,"w0":265,"w1":270},{"i":44,"text":"The farmer laughs.","s":108.97,"e":110.259,"w0":271,"w1":273},{"i":45,"text":"The stranger shakes his head.","s":110.437,"e":112.518,"w0":274,"w1":278},{"i":46,"text":"And the strong man says sorry.","s":112.696,"e":114.876,"w0":279,"w1":284},{"i":47,"text":"The next night, Kato leaves two cups.","s":115.054,"e":117.743,"w0":285,"w1":291},{"i":48,"text":"One full of milk.","s":117.921,"e":119.176,"w0":292,"w1":295},{"i":49,"text":"And one lying on its side,","s":119.355,"e":121.27,"w0":296,"w1":301},{"i":50,"text":"just for his tiny guest.","s":121.349,"e":123.1,"w0":302,"w1":306}],"shots":[{"id":"N01","from_line":0,"to_line":0},{"id":"N02","from_line":1,"to_line":1},{"id":"N03","from_line":2,"to_line":2},{"id":"N0       if (b.errors[id]) out.errors.push(b.errors[id]);
      [.05, .5, .95].forEach(function (f) {
        var t = r.from + (r.to - r.from) * f;
        try { K.frame(Math.floor(t * 12) / 12) } catch (e) { out.errors.push('At ' + (t - r.from).toFixed(1) + ' s into the shot: ' + errText(e)) }
      });
      var e2 = D.errors()[id]; if (e2 && out.errors.indexOf(e2) < 0) out.errors.push(e2);
      (D.warnings()[id] || []).forEach(function (w) { out.warnings.push(w) });
      out.ok = !out.errors.length;
    });
    post({ type: 'check-shots', results: res });
  }

  /* ---------- standalone page controls ---------- */
  var UI = null;
  function standaloneUI(b) {
    var bar = document.createElement('div');
    bar.style.cssText = 'position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;padding:6px 12px 6px 6px;border-radius:999px;background:rgba(233,223,200,.14);color:#e9dfc8;font:700 12px "Trebuchet MS",sans-serif;z-index:9;width:min(520px,calc(100% - 24px));box-sizing:border-box';
    bar.innerHTML = '<button id="sp">Play</button><input id="ss" type="range" min="0" max="' + P.cut.duration + '" step=".01" value="0" style="flex:1"><span id="st">0.0</span><span id="sh"></span>';
    document.body.appendChild(bar);
    [].forEach.call(bar.querySelectorAll('button'), function (x) { x.style.cssText = 'border:0;border-radius:999px;padding:8px 12px;background:#e9dfc8;color:#14111a;font:inherit;cursor:pointer' });
    var playing = false, sp = bar.querySelector('#sp');
    sp.onclick = function () { playing = !playing; playing ? play() : pause(); sp.textContent = playing ? 'Pause' : 'Play' };
    bar.querySelector('#ss').oninput = function () { seek(+this.value) };
    UI = { tick: function (t, sh) { bar.querySelector('#st').textContent = t.toFixed(1) + ' s'; bar.querySelector('#sh').textContent = sh ? sh.id : ''; if (document.activeElement !== bar.querySelector('#ss')) bar.querySelector('#ss').value = t } };
  }

  /* ---------- messages ---------- */
  window.addEventListener('message', function (e) {
    var m = e.data || {}; if (!m.type) return;
    if (m.type === 'load') { start(m.payload); return }
    if (!built) return;
    if (m.type === 'play') play(); if (m.type === 'pause') pause(); if (m.type === 'seek') seek(m.t);
    if (m.type === 'record') startRec(); if (m.type === 'stop-record') stopRec();
    if (m.type === 'captions') P.captions = m.on;
    if (m.type === 'grab') { var wh = outSize(); GRAB = { w: wh[0], h: wh[1] } }
    if (m.type === 'cancel') CANCEL = true;
    if (m.type === 'sound') { P.sound = m.on; K.sound(m.on); if (ST.gain) ST.gain.gain.value = m.on ? 1 : 0 }
    if (m.type === 'style') { var mixChanged = JSON.stringify(P.mix) !== JSON.stringify(m.mix); P.capStyle = m.capStyle; P.mix = m.mix; if (mixChanged) { ST.buf = null; soundtrack().then(function () { if (PLAYING) stStart() }) } D.groupSize = (m.capStyle && m.capStyle.group) || 3; K.sfxVol = MIX().sfx }
  });
  function start(p) {
    P = p; say('Building…');
    setTimeout(function () {
      try {
        if (p.mode === 'check-assets') checkAssets(p);
        else if (p.mode === 'sheet') sheet(p);
        else if (p.mode === 'preview') preview(p);
        else if (p.mode === 'check-shots') checkShots(p);
        else if (p.mode === 'export') exportMode(p).catch(function (e) { post({ type: 'fatal', msg: 'Export failed: ' + errText(e) }) });
        else playMode(p);
      } catch (e) { say('Error: ' + errText(e)); post({ type: 'fatal', msg: errText(e) + lineInfo(e) }) }
    }, 20);
  }
  if (window.STAGE_PAYLOAD) start(window.STAGE_PAYLOAD); else post({ type: 'stage-ready' });
  window.STAGE = { start: start, play: play, pause: pause, seek: seek, record: startRec };
})();

</script>
