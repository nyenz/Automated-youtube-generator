function shot(size,ch,wx,groundY,o){o=o||{};const Q=STAGE.shot[size]||STAGE.shot.FACE;let s,py;

  else{const sc=ch.scale*(o.size||1),hk=ch.headK||1,drop=(o.drop||0)*sc,top=groundY-(BODY.top+(hk-1)*86)*sc+drop,headY=groundY-(BODY.head+(hk-1)*43)*sc+drop,R=43*hk*sc;

  const W=P.WORDS=[];P.SEG.forEach(([a,b,tx])=>{const ws=tx.split(' '),wt=ws.map(w=>w.replace(/[^a-z]/gi,'').length+1.6+(/[,.:]$/.test(w)?2:0)),tot=wt.reduce((x,y)=>x+y,0);let t=a-P.AUDIO_START;ws.forEach((w,i)=>{const dd=(b-a)*wt[i]/tot;W.push({w,t0:t,t1:t+dd});t+=dd;});});

  const G=P.GROUPS=[];for(let i=0;i<W.length;){const a=W[i],b=W[i+1],K=P.KEY;if(b&&!/[,.:]$/.test(a.w)&&(a.w+b.w).length<=9&&b.t0-a.t1<.1){G.push({tx:a.w+' '+b.w,t0:a.t0,t1:b.t1,key:K.test(a.w)||K.test(b.w)});i+=2;}else{G.push({tx:a.w,t0:a.t0,t1:a.t1,key:K.test(a.w)});i++;}}
  /* camera: keys are [time, x, y, zoom], eased; zoom blends by ratio */
  P.camAt=t=>{const K=P.KEYS;let i=0;while(i<K.length-2&&t>=K[i+1][0])i++;const a=K[i],b=K[i+1],u=sm((t-a[0])/(b[0]-a[0]));
    const c={x:a[1]+(b[1]-a[1])*u,y:a[2]+(b[2]-a[2])*u,s:a[3]*Math.pow(b[3]/a[3],u)};return P.cam?P.cam(t,c)||c:c;};
  P.render=function(t){t=clamp(t,0,P.END);UID=0;NOW=t;
    const c=P.camAt(t),c0=P.camAt(Math.max(0,t-1/60)),m=moodAt(P,t);
    const IN=P.IN||(P.id===1?'dip':'whip'),OUT=P.OUT||(P.id===P.of?'none':'whip');
    /* joins: a whip slides the picture out to the left under blur and the next part in from the right, so two parts read as one move */
    const hi=IN==='whip'?1-sm(t/.2):0,ho=OUT==='whip'?sm((t-(P.END-.2))/.2):0,hw=ON.blur?Math.max(hi,ho):0,hx=STAGE.W*(hi*hi-ho*ho);

      for(const [ti,a] of P.HITS)if(t>=ti&&t<ti+.5){const dd=t-ti,k=a*Math.exp(-dd*9);sx+=k*Math.sin(dd*58);sy+=k*.8*Math.cos(dd*47);}}
    /* what the part's draw() gets */

      screen(wx,wy,f){f=f==null?1:f;const sc=f>1?c.s*f:1+(c.s-1)*f;return [STAGE.cx+sc*(wx-c.x*f),STAGE.cy+sc*(wy+c.y*f)];},   // where a world point of layer f is on screen
      full(inner,by){by=ON.blur?by||0:0;X._vb=by;return `<g ${by>.6?'filter="url(#vb)"':''}>${inner}</g>`;},

    let o=`<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${m.sky[0]}"/><stop offset=".45" stop-color="${m.sky[1]}"/><stop offset=".7" stop-color="${m.sky[2]}"/></linearGradient>
  <linearGradient id="gnd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${m.gnd[0]}"/><stop offset=".35" stop-color="${m.gnd[1]}"/></linearGradient>
  <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E2A4A"/><stop offset="1" stop-color="#02060F"/></linearGradient>

  ${F('mbAll',bAll)}${F('mbBg',bBg)}${F('mbFg',bFg)}${F('vb',[0,X._vb])}</defs>`;
    o+=`<rect width="${STAGE.W}" height="${STAGE.H}" fill="#05070F"/><g transform="translate(${sx.toFixed(2)} ${sy.toFixed(2)})">`+(X.sky?`<rect x="-20" y="-20" width="${STAGE.W+40}" height="${STAGE.H+40}" fill="url(#sky)"/>`:'')+`<g transform="translate(${hx.toFixed(1)} 0)">${body}</g></g>`;

ASSET('hills',{band:'far',note:'one soft ridge, 1800 wide, filled down to the bottom. c = colour (mix the low sky with indigo)',box:[-900,-260,1800,330],demo:{c:'#52608E'},still:'far land does not move; the mist and sky over it give the life'},
 ({c='#52608E'})=>`<path d="M-900,0V-120Q-600,-230 -300,-150T300,-170T900,-130V0Z" fill="${c}"/><rect x="-900" y="-4" width="1800" height="700" fill="${c}"/>`);
ASSET('mist',{band:'far, middle',note:'two soft mist bars (kasumi). never touches the ground of the subject layer. alive: the bars drift apart slowly',box:[-440,-110,980,70],demo:{},dark:1,alive:'drift'},
 ({x=0,y=0,k=1,...o})=>{const t=LIFE.t(o),d1=LIFE.sway(t,16,.21,x*.01),d2=LIFE.sway(t,12,.17,2+x*.01);return `<g transform="translate(${x} ${y})" opacity="${k}"><rect x="${(-420+d1).toFixed(1)}" y="-98" width="520" height="20" rx="10" fill="#FBF3DC" opacity=".5"/><rect x="${(60+d2).toFixed(1)}" y="-64" width="460" height="16" rx="8" fill="#FBF3DC" opacity=".42"/></g>`;});
ASSET('moon',{band:'sky',note:'moon with halo and a gold ring. anchored at its centre. alive: the halo breathes',box:[-130,-130,260,260],demo:{x:0,y:0},dark:1,alive:'glow'},
 ({x=0,y=0,k=1,...o})=>`<g opacity="${k}"><circle cx="${x}" cy="${y}" r="${(120+LIFE.bob(LIFE.t(o),5,.6)).toFixed(1)}" fill="#DCE6FF" opacity=".16"/><circle cx="${x}" cy="${y}" r="40" fill="#F3EAC8"/><circle cx="${x}" cy="${y}" r="52" fill="none" stroke="#D9B45A" stroke-width="1.4" opacity=".7"/></g>`);
ASSET('lowSun',{band:'sky',note:'red sun with a warm glow. anchored at its centre. k = strength 0 to 1. alive: the glow breathes',box:[-160,-160,320,320],demo:{x:0,y:0},dark:1,alive:'glow'},
 ({x=0,y=0,k=1,...o})=>`<circle cx="${x}" cy="${y}" r="${(150+LIFE.bob(LIFE.t(o),6,.5)).toFixed(1)}" fill="#FFD9A0" opacity="${(.5*k).toFixed(2)}"/><circle cx="${x}" cy="${y}" r="46" fill="#C8402F" opacity="${k.toFixed(2)}"/>`);
ASSET('ambulance',{band:'subject',note:'side view, open lit back door on the right. 330 wide, 268 tall. alive: roof beacon flashes, door light flickers softly',box:[-270,-280,370,290],demo:{x:0},alive:'blink'},
 ({x=0,...o})=>`<g transform="translate(${x} 0)"><rect x="-250" y="-250" width="330" height="214" rx="16" fill="#E9DFC6" stroke="#D9B45A" stroke-width="2"/><rect x="-250" y="-150" width="330" height="22" fill="#C8402F"/><rect x="24" y="-232" width="50" height="190" rx="4" fill="#FFE2A0"/><rect x="-232" y="-226" width="92" height="60" rx="6" fill="#2F4A7A"/><circle cx="-180" cy="-36" r="34" fill="#10182C"/><circle cx="-180" cy="-36" r="14" fill="#D9B45A"/><circle cx="20" cy="-36" r="34" fill="#10182C"/><circle cx="20" cy="-36" r="14" fill="#D9B45A"/><rect x="-110" y="-268" width="46" height="18" rx="6" fill="#C8402F"/><rect x="-110" y="-268" width="46" height="18" rx="6" fill="#FF8A6A" opacity="${LIFE.blink(LIFE.t(o),.9,.38)?'.85':'0'}"/><rect x="24" y="-232" width="50" height="190" rx="4" fill="#FFF3C8" opacity="${(.25*(LIFE.flicker(LIFE.t(o),1)-.72)/.28).toFixed(2)}"/></g>`);
ASSET('sled',{band:'subject',note:'small red sled with a curled runner',box:[-70,-40,150,50],demo:{x:0},still:'a sled resting on the ice; it moves only when pulled'},

ASSET('board',{band:'subject',note:'red rescue board lying on the ground, 270 long',box:[-150,-30,300,40],demo:{x:0},still:'lies flat on the ground'},
 ({x=0})=>`<rect x="${x-135}" y="-10" width="270" height="10" rx="5" fill="#C8402F" stroke="#D9B45A" stroke-width="1.2"/>`);
ASSET('iceHole',{band:'subject',note:'broken hole in pond ice with bright cracked edges. anchored at its centre. alive: the dark water ripples',box:[-190,-40,380,110],demo:{x:0,y:0},dark:1,alive:'ripple'},
 ({x=0,y=0,...o})=>`<g transform="translate(${x} ${y})"><ellipse cx="0" cy="0" rx="170" ry="40" fill="#060B18"/>${[0,1,2].map(i=>{const p=LIFE.drift(LIFE.t(o),.35,1,i/3);return `<ellipse cx="${(i*30-30)}" cy="4" rx="${(30+90*p).toFixed(1)}" ry="${(6+18*p).toFixed(1)}" fill="none" stroke="#3E5A86" stroke-width="2" opacity="${(.55*(1-p)).toFixed(2)}"/>`;}).join('')}<path d="M-168,-4l40,-22l34,18l44,-26l52,20l50,-22l48,24l42,-14l28,22" fill="none" stroke="#EAF2FF" stroke-width="5" stroke-linejoin="round"/><path d="M-140,22l48,10l60,-6l70,12l64,-10l46,4" fill="none" stroke="#B9C9E4" stroke-width="4"/></g>`);
ASSET('thermoGun',{band:'prop',note:'hand-held infrared thermometer with a screen. val = the number shown. anchored at the grip. alive: the red laser dot pulses',box:[-50,-50,100,110],demo:{x:0,y:0,val:7},dark:1,alive:'pulse'},
 ({x=0,y=0,val=7,unit='°C',...o})=>`<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(-24)"><path d="M-6,8L14,8L10,30L-2,30Z" fill="#2A2F3E"/><rect x="-30" y="-22" width="62" height="34" rx="8" fill="#F3E4BE" stroke="#D9B45A" stroke-width="1.5"/><rect x="-22" y="-16" width="46" height="21" rx="3" fill="#10182C"/><text x="1" y="-.5" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="12.5" fill="#BFF3D0">${val.toFixed(1)}${unit}</text><circle cx="27" cy="6" r="2.4" fill="#C8402F"/><path d="M4,30L7,44" stroke="#FF5A48" stroke-width="1.2" opacity=".8"/></g><circle cx="${(x+20).toFixed(1)}" cy="${(y+44).toFixed(1)}" r="${(2.6+1.4*LIFE.pulse(LIFE.t(o),110)).toFixed(2)}" fill="#FF5A48" opacity=".9"/>`);
</script>

<script>/* every preview: step, name, what it does, the call, length in seconds, draw(t, X) */
const W0=()=>STAGE.W,H0=()=>STAGE.H;
function world(t,X,o){o=o||{};const m=X.m,pc=mix(m.sky[2],'#0C1630',.62);
  return X.lay(.05,A.moon({x:150,y:-520,k:1}))+X.lay(.14,A.hills({c:mix(m.sky[2],'#1B2A4A',.45)})+[-420,-230,-40,160,350].map((x,i)=>A.pine({x,h:150+i*18,c:pc})).join('')+A.mist({}),'mbBg')+
  X.lay(1,`<rect x="-3000" y="-2" width="7000" height="1400" fill="url(#gnd)"/>`+A.ambulance({x:-330})+(o.people===false?'':place(CAST.medic,-40,0,poseAt('stand',t),faceAt(o.mf||'worried',t),X.who('normal'))+place(CAST.boy,90,0,poseAt('stand',t),faceAt(o.bf||'pain',t),X.who(o.bs||'normal',1,'side',o.bc||null))),'mbAll');}
function inside(t,c){c=c||['#14355A','#7FD8EA'];return `<rect width="${W0()}" height="${H0()}" fill="${c[0]}"/>`+[...Array(12)].map((_,i)=>`<circle cx="${(i*71+20*Math.sin(t+i))%540}" cy="${(i*137+t*60)%960}" r="${28+i%4*10}" fill="${c[1]}" opacity=".55" stroke="#D9B45A" stroke-width="2"/>`).join('')+`<text x="270" y="300" text-anchor="middle" font-family="Archivo Black,Impact,sans-serif" font-size="46" fill="#FFFDF4" stroke="#0A0A12" stroke-width="7" paint-order="stroke">INSIDE VIEW</text>`;}
function news(t){return inside(t,['#3A1020','#C8402F']).replace('INSIDE VIEW','THE NEWS');}
function lake(t,X){return X.lay(.05,A.moon({x:150,y:-520,k:1}))+X.lay(.14,A.hills({c:'#3A4B76'})+[-420,-200,60,300].map((x,i)=>A.pine({x,h:160+i*15,c:'#1B2A44'})).join(''),'mbBg')+X.lay(1,`<rect x="-3000" y="-2" width="7000" height="3000" fill="#6F8FBF"/><path d="M-3000,0H4000" stroke="#EAF4FF" stroke-width="3"/>`+A.sled({x:-260})+place(CAST.medic,-120,0,poseAt('kneel',t),faceAt('worried',t),X.who('normal')),'mbAll');}
function under(t,X){return X.lay(1,`<rect x="-3000" y="0" width="7000" height="4000" fill="url(#deep)"/>`+[-300,-60,220,420].map((x,i)=>`<ellipse cx="${x}" cy="${980+i*20}" rx="${70+i*10}" ry="34" fill="#0A2238"/>`).join('')+[...Array(8)].map((_,i)=>`<path d="M${-300+i*90},1000 q${10*Math.sin(t+i)},-60 0,-120" stroke="#1F5A4A" stroke-width="8" fill="none"/>`).join('')+place(CAST.boy,40+10*Math.sin(t*.8),720+8*Math.sin(t),poseAt('float',t),faceAt('limp',t),X.who('cold')));}
function room(t,X){return X.lay(1,`<rect x="520" y="-1200" width="3000" height="1400" fill="#3A2A44"/><rect x="520" y="-2" width="3000" height="900" fill="#5A4A3A"/><rect x="760" y="-420" width="160" height="200" fill="#F3E4BE" stroke="#D9B45A" stroke-width="4"/>`+place(CAST.mother,860,0,poseAt('stand',t),faceAt('shocked',t),X.who('normal')));}
const DEMOS=[
 /* ---------- step 1: living scenes and continuity ---------- */
 {step:1,name:'Conditions that stay',what:'Wet, dirt, torn clothes and a bandage are drawn by the engine and stay from scene to scene. Here the boy gets dirty, then torn, then bandaged.',call:"COND:{boy:{dirt:.6, torn:.5, bandage:'armF'}} and X.who('normal', 1, 'side', P.COND.boy)",len:6,
  draw:(t,X)=>{const c=t<1.5?{}:t<3?{dirt:.7}:t<4.5?{dirt:.7,torn:.6}:{dirt:.7,torn:.6,bandage:'armF'};const lab=t<1.5?'clean':t<3?'+ dirt':t<4.5?'+ torn':'+ bandage';
   return world(t,X,{bc:c,bf:t<4.5?'pain':'relief'})+`<text x="270" y="120" text-anchor="middle" font-family="Archivo Black,Impact,sans-serif" font-size="44" fill="#F6C956" stroke="#0A0A12" stroke-width="8" paint-order="stroke">${lab}</text>`;}},
 {step:1,name:'Wet and cold',what:'Out of cold water: wet hair and clothes, drips, a cold blue skin. The state sheet keeps him wet in the next part too.',call:"X.who('wet') · X.who('cold') · COND:{boy:{wet:1, cold:1}}",len:5,
  draw:(t,X)=>world(t,X,{bs:t<2.5?'wet':'cold',bf:'afraid'})},

<script>/* the preview page: list of steps on the left, the live picture in the middle, what it is on the right */
ON.caps=0;
const STEPS={1:['Living scenes and continuity','What happened stays: conditions, wet and cold, feelings that blend, a limp, a background that moves.'],2:['Story bible','The plan writes a state sheet, feelings arcs, world facts and causes; every scene gets its row and is checked against it.'],3:['Watch & improve','The app page: player, timeline with pictures and problem marks, improve prompts with kinds and checklists, the before / after report.'],4:['Zoom and inside views','Dive in, pull back, x-ray, cutaway, lens, exploded view, scale comparison.'],5:['Frames and seamless moves','Pictures on a TV, phone, paper, photo, window, eye; going under water, into the ground, through a wall, wipes, morph, crane.'],6:['Time and place','Flashback, date card, calendar, clock, counter, rewind, timeline, map line, location card, globe.'],8:['One take','The main principle: the camera never cuts. It travels through one world, sinks through water and ground, slides through walls, flies into windows, and parts carry on the same shot.'],7:['Explaining, emphasis, paper transitions','Name tag, callout, gauge, split screen, inset, draw-on, spotlight, iris, slow motion, match cut, shake, silence beat, page, fold, flats, ink. Cut-like ones (match cut, split, paper transitions) are for a new chapter only.']};
const EXTRA=[
 {step:2,name:'The state sheet (example)',what:'People down the side, parts across: what each person looks like at the start of each part, what changes on which word, and how they feel. The app shows this table in Results.',call:'"state", "arcs", "world", "effects" in the plan (P01)',table:true},
 {step:3,name:'The workshop page',what:'Left: the player (first picture at once, frame steps, 0.5x, loop) and the timeline with a picture per part, the spoken words and coloured problem marks. Right: Improve, Issues, Changes, Export, Upload.',call:'Stage 7 · Watch & improve',img:'ws'},
 {step:3,name:'Before and after report',what:'Old and new play side by side. The verdict (Changed, Partly, Nothing changed), each asked fix as Fixed or Still there, changed pictures marked, code changes in plain words, and a message to send back.',call:'Paste reply I01 → Check and compare',img:'cmp'}];
const ALL=[...DEMOS,...EXTRA].sort((a,b)=>a.step-b.step);
let id=200;DEMOS.forEach(d=>{d.P=PART({id:++id,of:1,AUDIO_START:0,AUDIO_END:d.len,SEG:[[0,d.len,'preview']],KEYS:d.keys||[[0,0,40,1.6],[d.len,0,40,1.7]],MOODS:[[0,d.moods||'dusk',0]],IN:'none',OUT:'none',draw:d.draw});});
const $=s=>document.querySelector(s);
let cur=null,t=0,playing=true,last=0,speed=1,busy=false;
function list(){const nav=$('#nav');nav.innerHTML='';for(const s in STEPS){const g=document.createElement('div');g.className='grp';g.innerHTML=`<div class="gh"><span class="sn">${s}</span><div><b>${STEPS[s][0]}</b><small>${ALL.filter(d=>d.step==s).length} previews</small></div></div>`;
  ALL.filter(d=>d.step==s).forEach(d=>{const b=document.createElement('button');b.className='it';b.textContent=d.name;b.onclick=()=>pick(d);d.btn=b;g.appendChild(b);});nav.appendChild(g);}}
function pick(d){cur=d;t=0;ALL.forEach(x=>x.btn&&x.btn.classList.toggle('on',x===d));$('#stepk').textContent='Step '+d.step+' · '+STEPS[d.step][0];$('#title').textContent=d.name;$('#what').textContent=d.what;$('#call').textContent=d.call;$('#stepw').textContent=STEPS[d.step][1];
  const live=!!d.P;$('#svgwrap').style.display=live?'':'none';$('#ctl').style.display=live?'':'none';$('#imgwrap').style.display=live?'none':'';
  if(!live){$('#imgwrap').innerHTML=d.img&&IMGS[d.img]?`<img src="${IMGS[d.img]}" alt="${d.name}">`:d.table?sheet():'';}
  const i=ALL.indexOf(d);$('#prev').disabled=i===0;$('#next').disabled=i===ALL.length-1;$('#count').textContent=(i+1)+' / '+ALL.length;frame();}
function sheet(){const P=['S01','S02','S03','S04'],rows=[['Boy',['clean · feels happy','→ at "ice": wet, cold (fell through the ice)<br>feels afraid','wet, cold, dirt · feels exhausted','→ at "warm": bandage armF<br>feels relief'],[1,1,1,1]],['Medic',['clean · feels determined','clean · feels worried','→ at "pulled": wet (into the water)<br>feels determined','wet · feels relief'],[0,1,1,1]],['Mother',['—','—','clean · feels shocked','feels relief'],[0,0,1,1]]];
  return `<div class="sheet"><table><thead><tr><th>Person</th>${P.map(p=>`<th>${p}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><th>${r[0]}</th>${r[1].map((c,i)=>`<td class="${r[2][i]?'':'off'}">${c.replace(/(→[^<]*)/,'<span class="w">$1</span>')}</td>`).join('')}</tr>`).join('')}</tbody></table><p>Grey cells: the person is not in that part. Orange lines: a change on a spoken word, with its reason.</p></div>`;}
function frame(){if(!cur||!cur.P)return;if(busy)return;busy=true;try{$('#scr').innerHTML=cur.P.render(Math.min(t,cur.len-.001));}catch(e){$('#scr').innerHTML='<text x="20" y="60" fill="#f88" font-size="20">'+e.message+'</text>';}busy=false;$('#bar').value=String(t/cur.len*1000);$('#tm').textContent=t.toFixed(1)+' / '+cur.len.toFixed(1)+' s';}
function loop(ts){const dt=last?(ts-last)/1000:0;last=ts;if(playing&&cur&&cur.P){t+=dt*speed;if(t>=cur.len)t=0;frame();}requestAnimationFrame(loop);}
function setPlay(p){playing=p;$('#play').innerHTML=p?'<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>':'<svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>';$('#play').setAttribute('aria-label',p?'Pause':'Play');}
window.addEventListener('load',()=>{$('#scr').setAttribute('viewBox','0 0 '+STAGE.W+' '+STAGE.H);list();pick(ALL[0]);setPlay(true);requestAnimationFrame(loop);
 $('#play').onclick=()=>setPlay(!playing);$('#bar').oninput=e=>{t=+e.target.value/1000*cur.len;frame();};
 $('#prev').onclick=()=>pick(ALL[Math.max(0,ALL.indexOf(cur)-1)]);$('#next').onclick=()=>pick(ALL[Math.min(ALL.length-1,ALL.indexOf(cur)+1)]);
 document.querySelectorAll('#spd button').forEach(b=>b.onclick=()=>{speed=+b.dataset.s;document.querySelectorAll('#spd button').forEach(x=>x.classList.toggle('on',x===b));});
 document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPlay(!playing);}if(e.key==='ArrowDown'||e.key==='ArrowRight')$('#next').click();if(e.key==='ArrowUp'||e.key==='ArrowLeft')$('#prev').click();});});
</script>
</body></html>
